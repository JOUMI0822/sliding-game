let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let lastTapTime = 0;

const DOUBLE_TAP_DELAY = 350;
const SWIPE_MIN_DISTANCE = 25;
const TAP_MAX_DURATION = 250;


gameWrapper.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        if (
            event.touches.length !== 1
        ) {
            return;
        }

        const touch =
            event.touches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

        touchStartTime =
            performance.now();

    },
    {
        passive: false
    }
);


gameWrapper.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


gameWrapper.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        if (
            event.changedTouches.length !== 1
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        const endX =
            touch.clientX;

        const endY =
            touch.clientY;

        const dx =
            endX -
            touchStartX;

        const dy =
            endY -
            touchStartY;

        const distance =
            Math.hypot(
                dx,
                dy
            );

        const duration =
            performance.now() -
            touchStartTime;

        if (energyRecoveryChoiceOpen) {
            if (distance < SWIPE_MIN_DISTANCE && duration <= TAP_MAX_DURATION) {
                const rect = canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) * (WIDTH / rect.width);
                const y = (touch.clientY - rect.top) * (HEIGHT / rect.height);

                if (isInsideRect(x, y, { x: 205, y: 310, w: 160, h: 42 })) {
                    useEnergyRecovery(1);
                } else if (isInsideRect(x, y, { x: 435, y: 310, w: 160, h: 42 })) {
                    useEnergyRecovery(2);
                }
            }
            return;
        }

        if (
            gameState === "multiplayerResult" ||
            gameState === "multiplayerWaitingResult"
        ) {
            if (distance < SWIPE_MIN_DISTANCE && duration <= TAP_MAX_DURATION) {
                closeMultiplayerSocket();
                multiplayerOpen = false;
                multiplayerRole = null;
                multiplayerResult = null;
                gameState = "start";
                setMessage("");
                updateUI();
            }
            return;
        }

        if (
            gameState === "start"
        ) {

            if (
                performance.now() -
                lastSettingsPointerTime <
                450
            ) {

                lastTapTime = 0;

                return;
            }

            const rect =
                canvas.getBoundingClientRect();

            const x =
                (
                    touch.clientX -
                    rect.left
                ) *
                (
                    WIDTH /
                    rect.width
                );

            const y =
                (
                    touch.clientY -
                    rect.top
                ) *
                (
                    HEIGHT /
                    rect.height
                );

            if (
                handleSettingsTap(
                    x,
                    y
                )
            ) {

                lastTapTime = 0;

                return;
            }

            if (
                settingsOpen
            ) {

                lastTapTime = 0;

                return;
            }

            const now =
                performance.now();

            if (
                now -
                lastTapTime <=
                DOUBLE_TAP_DELAY
            ) {

                lastTapTime = 0;

                startNewGame();

            } else {

                lastTapTime =
                    now;
            }

            return;
        }

        if (
            gameState === "gameover"
        ) {

            if (
                distance >=
                SWIPE_MIN_DISTANCE ||
                duration >
                TAP_MAX_DURATION
            ) {

                lastTapTime = 0;

                return;
            }

            const now =
                performance.now();

            if (
                now -
                lastTapTime <=
                DOUBLE_TAP_DELAY
            ) {

                lastTapTime = 0;

                gameState = "start";

                settingsOpen =
                    false;

                resetRecoil();

                flash.alpha = 0;

                setMessage("");

                updateUI();

            } else {

                lastTapTime =
                    now;
            }

            return;
        }

        if (
            distance >=
            SWIPE_MIN_DISTANCE
        ) {

            lastTapTime = 0;

            if (
                gameState !==
                "playing" ||
                movement
            ) {
                return;
            }

            if (
                Math.abs(dx) >
                Math.abs(dy)
            ) {

                if (
                    dx > 0
                ) {

                    applyRecoil(
                        1,
                        0,
                        28,
                        2,
                        0.09
                    );

                    startMove(
                        1,
                        0
                    );

                } else {

                    applyRecoil(
                        -1,
                        0,
                        28,
                        2,
                        0.09
                    );

                    startMove(
                        -1,
                        0
                    );
                }

            } else {

                if (
                    dy > 0
                ) {

                    applyRecoil(
                        0,
                        1,
                        28,
                        2,
                        0.09
                    );

                    startMove(
                        0,
                        1
                    );

                } else {

                    applyRecoil(
                        0,
                        -1,
                        28,
                        2,
                        0.09
                    );

                    startMove(
                        0,
                        -1
                    );
                }
            }

            return;
        }

        if (
            duration >
            TAP_MAX_DURATION
        ) {

            lastTapTime = 0;

            return;
        }

        const now =
            performance.now();

        if (
            now -
            lastTapTime <=
            DOUBLE_TAP_DELAY
        ) {

            lastTapTime = 0;

            if (
                gameState !==
                "gameover" &&
                !multiplayerMatchActive &&
                gameState !== "multiplayerWaitingRound" &&
                gameState !== "multiplayerWaitingResult" &&
                gameState !== "multiplayerResult"
            ) {
                if (!useSecondPathGuide()) {
                    skipMap();
                }
            }

        } else {

            lastTapTime =
                now;
        }

    },
    {
        passive: false
    }
);

/* =========================================================
   업데이트
========================================================= */

function update(delta) {

    if (multiplayerMatchActive) {
        multiplayerSendAccumulator += delta;
        if (opponent.visible) {
            const follow = Math.min(1, delta * 18);
            opponent.x += (opponent.targetX - opponent.x) * follow;
            opponent.y += (opponent.targetY - opponent.y) * follow;
        }
    }

    for (
        let i = trail.length - 1;
        i >= 0;
        i--
    ) {

        trail[i].life -=
            delta * 3.5;

        if (
            trail[i].life <= 0
        ) {
            trail.splice(i, 1);
        }
    }

    updateRecoil(delta);

    if (
        shake.time > 0
    ) {

        shake.time -= delta;

        if (
            shake.time <= 0
        ) {

            shake.time = 0;
            shake.power = 0;
        }
    }

    if (
        flash.alpha > 0
    ) {

        flash.alpha -=
            delta * 0.9;

        if (
            flash.alpha < 0
        ) {
            flash.alpha = 0;
        }
    }

    updateMapTransition(delta);

    if (
        gameState === "playing"
    ) {

        remainingTime -= delta;

        if (
            remainingTime <= 0
        ) {

            remainingTime = 0;

            timeoutGame();

            return;
        }

        updateMovement(delta);
        sendMultiplayerPosition();

        updateUI();
    }
}

    if (
        clearStreak < 1
    ) {
        return 0;
    }

    if (
        clearStreak === 1
    ) {
        return 0.07;
    }

    return Math.min(

        0.24 +
        (clearStreak - 2) *
        0.15
    );
}


function drawRainbowBorder(
    strength
) {

    const time =
        performance.now() *
        0.001;

    ctx.save();

    ctx.globalCompositeOperation =
        "screen";

    for (
        let i = 0;
        i < layers;

                time * 45 +
                i * 52

function drawWaveBorder(

        "screen";

    const gap = 7;
    const step = 24;

    const base =
        1.5 +
        strength * 1.2;

    const maxBar =
        4 +
        strength * 8;

    const alpha =
        0.055 +
        strength * 0.065;

    const topCount =
        Math.floor(
            (
                WIDTH -
                gap * 2
            ) /
            step
        );

    for (
        let i = 0;
        i < topCount;
        i++
    ) {

        const x =
            gap +
            i * step +
            step / 2;

        const beat =
            (
                Math.sin(
                    time * 5.0 -
                    i * 0.72
                ) + 1
            ) * 0.5;

        const beat2 =
            (
                Math.sin(
                    time * 8.0 +
                    i * 1.15
                ) + 1
            ) * 0.5;

        const h =
            base +
            maxBar *
            (
                beat * 0.65 +
                beat2 * 0.35
            );

        const hue =
            190 +
            Math.sin(
                i * 0.35 +
                time * 0.8
            ) *
            18;

        ctx.fillStyle =
            `hsla(${hue},100%,68%,${alpha})`;

        ctx.fillRect(
            x - 1.5,
            gap,
            3,
            h
        );

        ctx.fillRect(
            x - 1.5,
            HEIGHT - gap - h,
            3,
            h
        );
    }

    const sideCount =
        Math.floor(
            (
                HEIGHT -
                gap * 2
            ) /
            step
        );

    for (
        let i = 0;
        i < sideCount;
        i++
    ) {

        const y =
            gap +
            i * step +
            step / 2;

        const beat =
            (
                Math.sin(
                    time * 5.0 -
                    i * 0.72 +
                    Math.PI * 0.5
                ) + 1
            ) * 0.5;

        const beat2 =
            (
                Math.sin(
                    time * 8.0 +
                    i * 1.15 +
                    Math.PI * 0.5
                ) + 1
            ) * 0.5;

        const h =
            base +

            ) *

        );

function drawStarsBorder(
    strength
) {

    const time =
        performance.now() *
        0.001;

    ctx.save();

    ctx.globalCompositeOperation =
        "screen";

    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const perimeter =
            (
                i / 28 +
                time * 0.035
            ) % 1;

        const total =
            WIDTH * 2 +
            HEIGHT * 2;

        let distance =
            perimeter * total;

        let x;
        let y;

        if (
            distance < WIDTH
        ) {

            x = distance;
            y = 0;

        } else if (
            distance <
            WIDTH + HEIGHT
        ) {

            x = WIDTH;

            y =
                distance -
                WIDTH;

        } else if (
            distance <
            WIDTH * 2 +
            HEIGHT
        ) {

            x =
                WIDTH -
                (
                    distance -
                    WIDTH -
                    HEIGHT
                );

            y = HEIGHT;

        } else {

            x = 0;

            y =
                HEIGHT -
                (
                    distance -
                    WIDTH * 2 -
                    HEIGHT
                );
        }

        const twinkle =
            (
                Math.sin(
                    time * 6 +
                    i * 2.7
                ) + 1
            ) / 2;

        const alpha =
            (
                0.04 +
                strength * 0.22
            ) *
            twinkle;

        const radius =
            1.2 +
            strength *
            2.8 *
            twinkle;

        ctx.fillStyle =
            `rgba(255,255,255,${alpha})`;

        ctx.shadowBlur =
            8 +
            strength * 12;

        ctx.shadowColor =
            `rgba(255,255,255,${alpha * 4})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}

        ctx.fillRect(
            offset,
            y,
            width,
            height
        );

        ctx.fillStyle =
            `rgba(255,35,70,${alpha * 0.8})`;

        ctx.fillRect(
            offset -
            3 -
            strength * 4,
            y + 1,
            width * 0.45,
            1
        );

        ctx.fillStyle =
            `rgba(30,255,215,${alpha * 0.7})`;

        ctx.fillRect(
            offset +
            4 +
            strength * 4,
            y - 1,
            width * 0.45,
            1
        );
    }


    const scanAlpha =
        0.012 +
        strength * 0.028;

    ctx.fillStyle =
        `rgba(255,255,255,${scanAlpha})`;

    for (
        let y = 0;
        y < HEIGHT;
        y += 6
    ) {

        ctx.fillRect(
            0,
            y,
            WIDTH,
            1
        );
    }


    if (
        strength > 0.25
    ) {

        const glitchCount =
            1 +
            Math.floor(
                strength * 3
            );

        for (
            let i = 0;
            i < glitchCount;
            i++
        ) {

            const y =
                Math.random() *
                HEIGHT;

            const h =
                1 +
                Math.random() *
                (
                    2 +
                    strength * 4
                );

            const shift =
                (
                    Math.random() - 0.5
                ) *
                (
                    10 +
                    strength * 35
                );

            const width =
                WIDTH *
                (
                    0.08 +
                    Math.random() *
                    0.30
                );

            ctx.globalCompositeOperation =
                "screen";

            ctx.fillStyle =
                `rgba(255,35,75,${
                    0.045 +
                    strength * 0.08
                })`;

            ctx.fillRect(
                shift - 3,
                y,
                width,
                h
            );

            ctx.fillStyle =
                `rgba(35,255,220,${
                    0.035 +
                    strength * 0.07
                })`;

            ctx.fillRect(
                shift + 3,
                y + h,
                width,
                h
            );
        }
    }


    if (
        hardPulse > 0.88 &&
        strength > 0.35
    ) {

        const y =
            Math.random() *
            HEIGHT;

        const alpha =
            0.06 +
            strength * 0.10;

        ctx.fillStyle =
            `rgba(255,255,255,${alpha})`;

        ctx.fillRect(
            0,
            y,
            WIDTH,
            1 +
            Math.random() * 2
        );
    }


    const inset =
        4 +
        strength * 5;

    ctx.lineWidth =
        1 +
        strength * 1.5;

    ctx.strokeStyle =
        `rgba(255,40,75,${
            0.035 +
            strength * 0.08
        })`;

    ctx.strokeRect(
        inset - strength * 2,
        inset,
        WIDTH -
            inset * 2 +
            strength * 4,
        HEIGHT -
            inset * 2
    );

    ctx.strokeStyle =
        `rgba(35,255,220,${
            0.03 +
            strength * 0.07
        })`;

    ctx.strokeRect(
        inset + strength * 2,
        inset,
        WIDTH -
            inset * 2 -
            strength * 4,
        HEIGHT -
            inset * 2
    );


    if (
        strength > 0.55
    ) {

        const noiseCount =
            12 +
            Math.floor(
                strength * 18
            );

        for (
            let i = 0;
            i < noiseCount;
            i++
        ) {

            const edge =
                Math.floor(
                    Math.random() * 4
                );

            const size =
                2 +
                Math.random() *
                (
                    4 +
                    strength * 8
                );

            let x;
            let y;

            if (
                edge === 0
            ) {

                x =
                    Math.random() *
                    WIDTH;

                y =
                    Math.random() *
                    (
                        8 +
                        strength * 18
                    );

            } else if (
                edge === 1
            ) {

                x =
                    WIDTH -
                    Math.random() *
                    (
                        8 +
                        strength * 18
                    );

                y =
                    Math.random() *
                    HEIGHT;

            } else if (
                edge === 2
            ) {

                x =
                    Math.random() *
                    WIDTH;

                y =
                    HEIGHT -
                    Math.random() *
                    (
                        8 +
                        strength * 18
                    );

            } else {

                x =
                    Math.random() *
                    (
                        8 +
                        strength * 18
                    );

                y =
                    Math.random() *
                    HEIGHT;
            }

            const alpha =
                0.04 +
                strength * 0.12;

            ctx.fillStyle =
                i % 2 === 0
                    ? `rgba(255,45,80,${alpha})`
                    : `rgba(35,255,220,${alpha})`;

            ctx.fillRect(
                x,
                y,
                size,
                size
            );
        }
    }

    ctx.restore();
}


function drawStreakEffect() {

    const strength =
        getStreakStrength();

    const effect =
        STREAK_EFFECTS[
            visualSettings.streakEffect
        ].value;

    if (
        strength <= 0 ||
        effect === "none"
    ) {
        return;
    }

    switch (
        effect
    ) {

        case "rainbow":
            drawRainbowBorder(
                strength
            );
            break;

        case "neon":
            drawNeonBorder(
                strength
            );
            break;

        case "fire":
            drawFireBorder(
                strength
            );
            break;

        case "ice":
            drawIceBorder(
                strength
            );
            break;

        case "wave":
            drawWaveBorder(
                strength
            );
            break;

        case "stars":
            drawStarsBorder(
                strength
            );
            break;

        case "glitch":
            drawGlitchBorder(
                strength
            );
            break;
    }
}


/* =========================================================
   위험 블록 스킨
========================================================= */

function drawDangerBlock(
    c,
    r,
    skin
) {

    const x =
        c * CELL;

    const y =
        r * CELL;

    const time =
        performance.now() *
        0.001;


    /* -----------------------------------------------------
       기본
    ----------------------------------------------------- */

    if (
        skin === "solid"
    ) {

        ctx.fillStyle =
            "#d93445";

        ctx.fillRect(
            x + 4,
            y + 4,
            CELL - 8,
            CELL - 8
        );

        ctx.fillStyle =
            "rgba(255,255,255,0.18)";

        ctx.fillRect(
            x + 8,
            y + 8,
            CELL - 16,
            4
        );

        return;
    }


    /* -----------------------------------------------------
       X 경고
    ----------------------------------------------------- */

    if (
        skin === "x"
    ) {

        ctx.strokeStyle =
            "#ff4052";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            x + 5,
            y + 5,
            CELL - 10,
            CELL - 10
        );

        ctx.strokeStyle =
            "#ff4052";

        ctx.lineWidth = 4;
        ctx.lineCap = "square";

        ctx.beginPath();

        ctx.moveTo(
            x + 11,
            y + 11
        );

        ctx.lineTo(
            x + CELL - 11,
            y + CELL - 11
        );

        ctx.moveTo(
            x + CELL - 11,
            y + 11
        );

        ctx.lineTo(
            x + 11,
            y + CELL - 11
        );

        ctx.stroke();

        ctx.strokeStyle =
            "rgba(255,64,82,0.35)";

        ctx.lineWidth = 2;

        ctx.shadowBlur = 5;
        ctx.shadowColor =
            "#ff4052";

        ctx.beginPath();

        ctx.moveTo(
            x + 11,
            y + 11
        );

        ctx.lineTo(
            x + CELL - 11,
            y + CELL - 11
        );

        ctx.moveTo(
            x + CELL - 11,
            y + 11
        );

        ctx.lineTo(
            x + 11,
            y + CELL - 11
        );

        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.lineCap = "butt";

        return;
    }


    /* -----------------------------------------------------
       경고
    ----------------------------------------------------- */

    if (
        skin === "warning"
    ) {

        ctx.fillStyle =
            "rgba(255,143,40,0.16)";

        ctx.fillRect(
            x + 4,
            y + 4,
            CELL - 8,
            CELL - 8
        );

        ctx.strokeStyle =
            "#ff9d3b";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            x + 5,
            y + 5,
            CELL - 10,
            CELL - 10
        );

        ctx.fillStyle =
            "#ffb347";

        ctx.font =
            "bold 25px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "!",
            x + CELL / 2,
            y + CELL / 2 + 1
        );

        return;
    }


    /* -----------------------------------------------------
       위험 / 방사능
    ----------------------------------------------------- */

    if (
        skin === "hazard"
    ) {

        ctx.fillStyle =
            "#18140a";

        ctx.fillRect(
            x + 4,
            y + 4,
            CELL - 8,
            CELL - 8
        );

        ctx.strokeStyle =
            "#ffd83d";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            x + 4,
            y + 4,
            CELL - 8,
            CELL - 8
        );

        ctx.fillStyle =
            "#ffd83d";

        ctx.font =
            "bold 22px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "☢",
            x + CELL / 2,
            y + CELL / 2 + 1
        );

        return;
    }


    /* -----------------------------------------------------
       화염
    ----------------------------------------------------- */

    if (
        skin === "fire"
    ) {

        const pulse =
            0.7 +
            Math.sin(
                time * 7
            ) *
            0.25;

        ctx.fillStyle =
            `rgba(255,45,30,${
                0.12 +
                pulse * 0.12
            })`;

        ctx.fillRect(
            x + 3,
            y + 3,
            CELL - 6,
            CELL - 6
        );

        ctx.strokeStyle =
            "#ff3b20";

        ctx.lineWidth = 3;

        ctx.shadowBlur = 8;
        ctx.shadowColor =
            "#ff3b20";

        ctx.strokeRect(
            x + 5,
            y + 5,
            CELL - 10,
            CELL - 10
        );

        ctx.shadowBlur = 0;

        ctx.fillStyle =
            "#ffcf33";

        ctx.font =
            "bold 23px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "🔥",
            x + CELL / 2,
            y + CELL / 2 + 1
        );

        return;
    }


    /* -----------------------------------------------------
       해골
    ----------------------------------------------------- */

    if (
        skin === "skull"
    ) {

        ctx.fillStyle =
            "#17191c";

        ctx.fillRect(
            x + 4,
            y + 4,
            CELL - 8,
            CELL - 8
        );

        ctx.strokeStyle =
            "#e94b58";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            x + 5,
            y + 5,
            CELL - 10,
            CELL - 10
        );

        ctx.fillStyle =
            "#f0f0f0";

        ctx.font =
            "bold 22px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "☠",
            x + CELL / 2,
            y + CELL / 2 + 1
        );

        return;
    }


    /* -----------------------------------------------------
       네온
    ----------------------------------------------------- */

    if (
        skin === "neon"
    ) {

        const pulse =
            0.65 +
            Math.sin(
                time * 5
            ) *
            0.25;

        ctx.fillStyle =
            `rgba(255,20,80,${
                0.035 +
                pulse * 0.055
            })`;

        ctx.fillRect(
            x + 3,
            y + 3,
            CELL - 6,
            CELL - 6
        );

        ctx.strokeStyle =
            `rgba(255,35,90,${
                0.65 +
                pulse * 0.25
            })`;

        ctx.lineWidth = 2;

        ctx.shadowBlur = 9;

        ctx.shadowColor =
            "#ff2360";

        ctx.strokeRect(
            x + 5,
            y + 5,
            CELL - 10,
            CELL - 10
        );

        ctx.strokeStyle =
            "rgba(255,100,150,0.7)";

        ctx.lineWidth = 1;

        ctx.strokeRect(
            x + 9,
            y + 9,
            CELL - 18,
            CELL - 18
        );

        ctx.shadowBlur = 0;

        return;
    }


    /* -----------------------------------------------------
       위험선
    ----------------------------------------------------- */

    if (
        skin === "stripe"
    ) {

        ctx.fillStyle =
            "#15171b";

        ctx.fillRect(
            x + 3,
            y + 3,
            CELL - 6,
            CELL - 6
        );

        ctx.save();

        ctx.beginPath();

        ctx.rect(
            x + 4,
            y + 4,
            CELL - 8,
            CELL - 8
        );

        ctx.clip();

        ctx.strokeStyle =
            "#e52e3e";

        ctx.lineWidth = 5;

        for (
            let offset = -CELL;
            offset < CELL * 2;
            offset += 12
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x + offset,
                y + CELL
            );

            ctx.lineTo(
                x + offset + CELL,
                y
            );

            ctx.stroke();
        }

        ctx.restore();

        ctx.strokeStyle =
            "#ff4052";

        ctx.lineWidth = 2;

        ctx.strokeRect(
            x + 4,
            y + 4,
            CELL - 8,
            CELL - 8
        );

        return;
    }


    /* -----------------------------------------------------
       글리치
    ----------------------------------------------------- */

    if (
        skin === "glitch"
    ) {

        const jitter =
            Math.sin(time * 18) * 1.8;

        ctx.save();

        /* 기본 어두운 블록 */
        ctx.fillStyle =
            "#11151d";

        ctx.fillRect(
            x + 3,
            y + 3,
            CELL - 6,
            CELL - 6
        );

        /* 청록 / 마젠타 색수차 */
        ctx.globalAlpha = 0.9;
        ctx.fillStyle =
            "rgba(35,255,220,0.75)";

        ctx.fillRect(
            x + 7 + jitter,
            y + 8,
            CELL - 17,
            5
        );

        ctx.fillStyle =
            "rgba(255,45,100,0.78)";

        ctx.fillRect(
            x + 11 - jitter,
            y + 15,
            CELL - 15,
            4
        );

        /* 잘린 디지털 조각 */
        ctx.globalAlpha = 0.85;
        ctx.fillStyle =
            "#23ffdc";

        ctx.fillRect(
            x + 6,
            y + 25 + Math.sin(time * 13) * 1.5,
            12,
            3
        );

        ctx.fillStyle =
            "#ff2d64";

        ctx.fillRect(
            x + 22,
            y + 29 + Math.cos(time * 16) * 1.5,
            10,
            3
        );

        /* 스캔라인 */
        ctx.globalAlpha = 0.28;
        ctx.fillStyle =
            "#ffffff";

        for (
            let lineY = 7;
            lineY < CELL - 5;
            lineY += 6
        ) {
            ctx.fillRect(
                x + 5,
                y + lineY,
                CELL - 10,
                1
            );
        }

        /* 테두리 */
        ctx.globalAlpha = 1;
        ctx.strokeStyle =
            "#23ffdc";

        ctx.lineWidth = 1.5;

        ctx.strokeRect(
            x + 4,
            y + 4,
            CELL - 8,
            CELL - 8
        );

        ctx.strokeStyle =
            "rgba(255,45,100,0.85)";

        ctx.strokeRect(
            x + 7 + jitter * 0.45,
            y + 7,
            CELL - 14,
            CELL - 14
        );

        /* 짧은 노이즈 조각 */
        for (
            let i = 0;
            i < 3;
            i++
        ) {
            const noiseX =
                x + 5 +
                Math.random() * (CELL - 12);

            const noiseY =
                y + 5 +
                Math.random() * (CELL - 12);

            ctx.fillStyle =
                i % 2 === 0
                    ? "rgba(35,255,220,0.8)"
                    : "rgba(255,45,100,0.8)";

            ctx.fillRect(
                noiseX,
                noiseY,
                3 + Math.random() * 5,
                1 + Math.random() * 2
            );
        }

        ctx.restore();

        return;
    }
}


/* =========================================================
   게임 화면
========================================================= */

function drawGame() {

    drawBackground();

    const shakeOffset =
        getShakeOffset();

    const ox =
        recoil.x +
        shakeOffset.x;

    const oy =
        recoil.y +
        shakeOffset.y;

    ctx.save();

    ctx.translate(
        ox,
        oy
    );


    /* 격자 */

    ctx.strokeStyle =
        "rgba(255,255,255,0.055)";

    ctx.lineWidth = 1;

    for (
        let c = 0;
        c <= COLS;
        c++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            c * CELL,
            0
        );

        ctx.lineTo(
            c * CELL,
            HEIGHT
        );

        ctx.stroke();
    }


    for (
        let r = 0;
        r <= ROWS;
        r++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            r * CELL
        );

        ctx.lineTo(
            WIDTH,
            r * CELL
        );

        ctx.stroke();
    }


    /* =====================================================
       위험 블록
    ===================================================== */

    const dangerSkin =
        DANGER_SKINS[
            visualSettings.dangerSkin
        ].value;

    for (
        const danger
        of dangers
    ) {

        const {
            c,
            r
        } =
            parseKey(
                danger
            );

        drawDangerBlock(
            c,
            r,
            dangerSkin
        );
    }


    /* =====================================================
       목표 - 파란색
    ===================================================== */

    if (
        goal
    ) {

        ctx.fillStyle =
            "#4da3ff";

        ctx.fillRect(
            goal.c * CELL + 5,
            goal.r * CELL + 5,
            CELL - 10,
            CELL - 10
        );

        ctx.fillStyle =
            "rgba(255,255,255,0.22)";

        ctx.fillRect(
            goal.c * CELL + 10,
            goal.r * CELL + 10,
            CELL - 20,
            CELL - 20
        );
    }


    /* =====================================================
       벽
    ===================================================== */

    const drawAnimatedWallSet =
        (
            wallSet,
            isNewWall
        ) => {

            const scale =
                getWallScaleForTransition(
                    isNewWall
                );

            for (
                const wall
                of wallSet
            ) {

                const {
                    c,
                    r
                } =
                    parseKey(
                        wall
                    );

                if (
                    isBoundary(c, r)
                ) {
                    continue;
                }

                if (
                    scale <= 0.001
                ) {
                    continue;
                }

                const size =
                    CELL * scale;

                const offset =
                    (
                        CELL -
                        size
                    ) / 2;

                ctx.fillStyle =
                    getWallColor();

                ctx.fillRect(
                    c * CELL + offset,
                    r * CELL + offset,
                    size,
                    size
                );

                ctx.strokeStyle =
                    "rgba(255,255,255,0.05)";

                ctx.strokeRect(
                    c * CELL +
                    offset +
                    0.5,

                    r * CELL +
                    offset +
                    0.5,

                    Math.max(
                        0,
                        size - 1
                    ),

                    Math.max(
                        0,
                        size - 1
                    )
                );
            }
        };


    for (
        const wall
        of walls
    ) {

        const {
            c,
            r
        } =
            parseKey(
                wall
            );

        if (
            !isBoundary(c, r)
        ) {
            continue;
        }

        ctx.fillStyle =
            getWallColor();

        ctx.fillRect(
            c * CELL,
            r * CELL,
            CELL,
            CELL
        );

        ctx.strokeStyle =
            "rgba(255,255,255,0.05)";

        ctx.strokeRect(
            c * CELL + 0.5,
            r * CELL + 0.5,
            CELL - 1,
            CELL - 1
        );
    }


    if (
        mapTransition.active
    ) {

        drawAnimatedWallSet(
            mapTransition.oldWalls,
            false
        );

        drawAnimatedWallSet(
            mapTransition.newWalls,
            true
        );

    } else {

        drawAnimatedWallSet(
            walls,
            true
        );
    }


    /* =====================================================
       경로 안내 프로토콜
    ===================================================== */

    if (
        activeItem === "pathGuide" &&
        performance.now() < pathGuideVisibleUntil &&
        pathGuidePath.length > 1
    ) {
        const now = performance.now();
        const fadeStart =
            pathGuideFadeStart > 0
                ? pathGuideFadeStart
                : pathGuideAutoFadeAt;
        const fadeProgress =
            now >= fadeStart
                ? Math.min(1, (now - fadeStart) / (PATH_GUIDE_FADE_DURATION * 1000))
                : 0;
        const fadeAlpha = Math.max(0, 1 - fadeProgress);

        const pulse =
            (0.32 +
            0.48 *
            (0.5 + 0.5 * Math.sin(now * 0.012))) *
            fadeAlpha;

        ctx.save();
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = `rgba(120,220,255,${pulse})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#55cfff";

        ctx.beginPath();

        pathGuidePath.forEach((point, index) => {
            const x = point.c * CELL + CELL / 2;
            const y = point.r * CELL + CELL / 2;

            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });

        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = `rgba(170,240,255,${pulse})`;

        for (let i = 0; i < pathGuidePath.length; i++) {
            if (i % 2 !== 0 && i !== pathGuidePath.length - 1) continue;
            const point = pathGuidePath[i];
            ctx.beginPath();
            ctx.arc(
                point.c * CELL + CELL / 2,
                point.r * CELL + CELL / 2,
                4,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        ctx.restore();
    }


    /* =====================================================
       이동 흔적
    ===================================================== */

    for (
        let i = 0;
        i < trail.length;
        i++
    ) {

        const point =
            trail[i];

        const alpha =
            (
                i + 1
            ) /
            trail.length *
            0.18 *
            (
                point.life ??
                1
            );

        ctx.fillStyle =
            `rgba(91,205,255,${alpha})`;

        ctx.beginPath();

        ctx.arc(
            point.x +
            CELL / 2,

            point.y +
            CELL / 2,

            7,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* =====================================================
       상대 플레이어 - 주황색
    ===================================================== */

    if (multiplayerMatchActive && opponent.visible) {
        const opx = opponent.x + 7;
        const opy = opponent.y + 7;
        ctx.fillStyle = "#ff9f43";
        ctx.fillRect(opx, opy, CELL - 14, CELL - 14);
        ctx.fillStyle = "rgba(255,255,255,0.32)";
        ctx.fillRect(opx + 4, opy + 4, CELL - 22, 4);
        ctx.fillStyle = "#ffd29a";

    }

    ===================================================== */

        const px =
            player.x + 5;

        const py =
            player.y + 5;

        ctx.fillStyle =
            "#45e77b";

    ctx.fillRect(
        px,
        py,
        CELL - 10,
        CELL - 10
    );

    ctx.fillStyle =
        "rgba(255,255,255,0.30)";

        ctx.fillRect(
            px + 5,
            py + 5,
            CELL - 20,
            5
        );
    }


    ctx.restore();


    /* =====================================================
       하단 메시지
    ===================================================== */

    if (
        messageText
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,0.58)";

        ctx.fillRect(
            0,
            HEIGHT - 42,
            WIDTH,

            "#f3f5f7";

            "600 17px Pretendard, Noto Sans KR, sans-serif";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            messageText,
            WIDTH / 2,
            HEIGHT - 21
        );
    }


    /* =====================================================
       플래시
    ===================================================== */

    if (
        flash.alpha > 0
    ) {

        ctx.fillStyle =
            flash.color;

        ctx.globalAlpha =
            flash.alpha;

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

        ctx.globalAlpha = 1;
    }


    drawStreakEffect();
}

        ctx.font = "34px Arial, sans-serif";

        let iconX = x + size / 2;
        if (type === "timeClock" || type === "energyShield") {
            const metrics = ctx.measureText(ITEM_DATA[type].icon);
            if (metrics.actualBoundingBoxLeft != null && metrics.actualBoundingBoxRight != null) {
                iconX += (metrics.actualBoundingBoxLeft - metrics.actualBoundingBoxRight) / 2;
            }

        ctx.fillText(ITEM_DATA[type].icon, iconX, y + size / 2);

        if (equipped) {
            ctx.fillStyle = "#111820";

            ctx.fillStyle = "#7ddcff";
            ctx.font = "bold 15px Arial, sans-serif";
            ctx.fillText("✓", x + size - 13, y + 13);

        ctx.fillStyle = "#cbd4dc";
        ctx.font = "12px Pretendard, Noto Sans KR, sans-serif";
        ctx.fillText(`${owned ? itemInventory[type] : 0}`, x + size / 2, y + size + 18);
    });

    ctx.font = "13px Pretendard, Noto Sans KR, sans-serif";

                drawDangerPreviewInBox(
                    selected.value,
                    previewBox
                );

                return;
            }


            /* ---------------------------------------------
               일반 설정 항목
            --------------------------------------------- */

            ctx.fillStyle =
                "#aeb8c5";

            ctx.font =
                "600 15px Pretendard, Noto Sans KR, sans-serif";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                row.label,
                WIDTH / 2,
                centerY - 27
            );


            drawSettingsButton(
                panel.x + 24,
                centerY - 1,
                62,
                42,
                "◀"
            );


            drawSettingsButton(
                panel.x + panel.w - 86,
                centerY - 1,
                62,
                42,
                "▶"
            );


            const selectedBox = {
                x: WIDTH / 2 - 155,
                y: centerY - 21,
                w: 310,
                h: 42
            };


            if (
                row.key === "wall" ||
                row.key === "background"
            ) {

                const displayColor =
                    row.key === "wall"
                        ? getWallColor()
                        : getBackgroundColor();

                ctx.fillStyle =
                    displayColor;

                ctx.beginPath();

                ctx.roundRect(
                    selectedBox.x,
                    selectedBox.y,
                    selectedBox.w,
                    selectedBox.h,
                    10
                );

                ctx.fill();


                const hex =
                    displayColor.replace(
                        "#",
                        ""
                    );

                const r =
                    parseInt(
                        hex.slice(0, 2),
                        16
                    );

                const g =
                    parseInt(
                        hex.slice(2, 4),
                        16
                    );

                const b =
                    parseInt(
                        hex.slice(4, 6),
                        16
                    );

                const luminance =
                    (
                        r * 299 +
                        g * 587 +
                        b * 114
                    ) / 1000;

                ctx.fillStyle =
                    luminance > 145
                        ? "#101318"
                        : "#ffffff";

                ctx.font =
                    "600 16px Pretendard, Noto Sans KR, sans-serif";

                ctx.textAlign =
                    "center";

                ctx.textBaseline =
                    "middle";

                ctx.fillText(
                    selected.name,
                    WIDTH / 2,
                    centerY
                );

                if (selected.custom) {
                    ctx.font =
                        "11px Pretendard, Noto Sans KR, sans-serif";
                    ctx.fillStyle =
                        luminance > 145
                            ? "rgba(16,19,24,0.72)"
                            : "rgba(255,255,255,0.72)";
                    ctx.fillText(
                        "눌러서 색상 코드 입력",
                        WIDTH / 2,
                        centerY + 15
                    );
                }

                ctx.strokeStyle =
                    "rgba(255,255,255,0.34)";

                ctx.lineWidth = 1.5;

                ctx.beginPath();

                ctx.roundRect(
                    selectedBox.x,
                    selectedBox.y,
                    selectedBox.w,
                    selectedBox.h,
                    10
                );

                ctx.stroke();

            } else {

                drawEffectPreviewInBox(
                    selected.value,
                    selected.name,
                    selectedBox
                );
            }
        }
    );


    ctx.fillStyle =
        "#7f8b99";

    ctx.font =
        "12px Pretendard, Noto Sans KR, sans-serif";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "1연속부터 적용(연속 클리어 횟수가 높을수록 효과가 강해집니다)",
        WIDTH / 2,

    );

    ctx.font =
        "13px Pretendard, Noto Sans KR, sans-serif";

    ctx.fillText(
        "설정은 자동으로 저장됩니다.",
        WIDTH / 2,
        526
    );


    drawSettingsButton(
        WIDTH / 2 - 80,
        538,
        160,
        34,
        "닫기"
    );


    ctx.restore();
}


/* =========================================================
   연속 효과 미리보기
========================================================= */

function drawEffectPreviewInBox(
    effect,
    name,
    box
) {

    // 기존 연속 효과 미리보기는 실제 게임 효과와 같은 렌더러를 사용합니다.
    // 미리보기의 모양/강도/애니메이션은 변경하지 않습니다.
    const previewStrength =
        3.50;

    if (
        effect !== "none"
    ) {

        ctx.save();

        ctx.translate(
            box.x,
            box.y
        );

        ctx.scale(
            box.w / WIDTH,
            box.h / HEIGHT
        );

        const outerInset = 0;
        const innerInset = 12;

        ctx.beginPath();

        ctx.rect(
            outerInset,
            outerInset,
            WIDTH -
            outerInset * 2,
            HEIGHT -
            outerInset * 2
        );

        ctx.rect(
            innerInset,
            innerInset,
            WIDTH -
            innerInset * 2,
            HEIGHT -
            innerInset * 2
        );

        ctx.clip(
            "evenodd"
        );

        switch (
            effect
        ) {

            case "rainbow":
                drawRainbowBorder(
                    previewStrength
                );
                break;

            case "neon":
                drawNeonBorder(
                    previewStrength
                );
                break;

            case "fire":
                drawFireBorder(
                    previewStrength
                );
                break;

            case "ice":
                drawIceBorder(
                    previewStrength
                );
                break;

            case "wave":
                drawWaveBorder(
                    previewStrength
                );
                break;

            case "stars":
                drawStarsBorder(
                    previewStrength
                );
                break;

            case "glitch":
                drawGlitchBorder(
                    previewStrength
                );
                break;
        }

        ctx.restore();
    }


    ctx.save();

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "rgba(255,255,255,0.94)";

    ctx.font =
        "600 15px Pretendard, Noto Sans KR, sans-serif";

    ctx.fillText(
        effect === "none"
            ? "효과 없음"
            : name,

        WIDTH / 2,

        box.y +
        box.h / 2
    );

    ctx.restore();
}

   설정 터치
========================================================= */

function handleSettingsTap(x, y) {
    const shopButton = getShopButton();
    const inventoryButton = getInventoryButton();
    const gear = getStartSettingsButton();

    // 2인용 메뉴가 열려 있으면 다른 시작 화면 기능보다 먼저 처리
    if (multiplayerOpen) {
        if (multiplayerMatchmaking) {
            if (isInsideRect(x, y, { x: 205, y: 345, w: 390, h: 48 })) {
                cancelMultiplayerMatchmaking();
                return true;
            }
            return true;
        } else if (!multiplayerRole) {
            if (isInsideRect(x, y, { x: 205, y: 205, w: 390, h: 52 })) {
                startMultiplayerMatchmaking();
                return true;
            }
            if (isInsideRect(x, y, { x: 205, y: 275, w: 390, h: 52 })) {
                createMultiplayerRoom();
                return true;
            }
            if (isInsideRect(x, y, { x: 205, y: 345, w: 390, h: 52 })) {
                joinMultiplayerRoom();
                return true;
            }
            if (isInsideRect(x, y, { x: 305, y: 415, w: 190, h: 42 })) {
                closeMultiplayerMenu();
                return true;
            }
        } else if (multiplayerRole === "host") {
            if (isInsideRect(x, y, { x: 205, y: 345, w: 180, h: 48 })) {
                if (multiplayerPeerJoined) startMultiplayerMatch();
                return true;
            }
            if (isInsideRect(x, y, { x: 415, y: 345, w: 180, h: 48 })) {
                multiplayerRoomCode = generateRoomCode();
                multiplayerSeed = generateMatchSeed();
                multiplayerPeerJoined = false;
                connectMultiplayerSocket(() => multiplayerSend({ type: "create", room: multiplayerRoomCode }));
                return true;
            }
            if (isInsideRect(x, y, { x: 205, y: 410, w: 390, h: 42 })) {
                closeMultiplayerMenu();
                return true;
            }
        } else {
            if (isInsideRect(x, y, { x: 205, y: 345, w: 180, h: 48 })) {
                joinMultiplayerRoom();
                return true;
            }
            if (isInsideRect(x, y, { x: 415, y: 345, w: 180, h: 48 })) {
                closeMultiplayerMenu();
                return true;
            }
        }
        return true;
    }

    if (!shopOpen && !inventoryOpen && !settingsOpen && isInsideRect(x, y, shopButton)) {
        shopOpen = true;
        shopPage = 0;
        return true;
    }

    if (!shopOpen && !inventoryOpen && !settingsOpen && isInsideRect(x, y, inventoryButton)) {
        inventoryOpen = true;
        inventoryDetailType = null;
        return true;
    }

    if (inventoryOpen) {
        const panel = { x: 55, y: 55, w: 690, h: 490 };

        if (inventoryDetailType) {
            const box = { x: 145, y: 145, w: 510, h: 320 };

            // 상세창 바깥의 빈 공간을 누르면 상세창만 닫고
            // 인벤토리 화면은 그대로 유지합니다.
            if (x < box.x || x > box.x + box.w || y < box.y || y > box.y + box.h) {
                closeInventoryDetail();
                return true;
            }

            // 상세창의 닫기 버튼
            if (isInsideRect(x, y, { x: 290, y: 395, w: 100, h: 38 })) {
                closeInventoryDetail();
                return true;
            }

            // 장착 / 해제
            if (isInsideRect(x, y, { x: 410, y: 395, w: 100, h: 38 })) {
                if (selectedItem === inventoryDetailType) unequipItem();
                else if (itemInventory[inventoryDetailType] > 0) equipItem(inventoryDetailType);
                closeInventoryDetail();
                return true;
            }

            if (inventoryDetailType === "timeClock") {
                if (isInsideRect(x, y, { x: 310, y: 292, w: 42, h: 38 })) {
                    adjustSelectedTimeClocks(-1);
                    return true;
                }
                if (isInsideRect(x, y, { x: 446, y: 292, w: 42, h: 38 })) {
                    adjustSelectedTimeClocks(1);
                    return true;
                }
            }

            if (inventoryDetailType === "energyRecovery") {
                if (isInsideRect(x, y, { x: 310, y: 292, w: 42, h: 38 })) {
                    adjustSelectedEnergyRecovery(-1);
                    return true;
                }
                if (isInsideRect(x, y, { x: 446, y: 292, w: 42, h: 38 })) {
                    adjustSelectedEnergyRecovery(1);
                    return true;
                }
            }
            return true;
        }

        if (x < panel.x || x > panel.x + panel.w || y < panel.y || y > panel.y + panel.h) {
            closeInventoryDetail();
            inventoryOpen = false;
            return true;
        }

        if (isInsideRect(x, y, { x: WIDTH / 2 - 80, y: 485, w: 160, h: 30 })) {
            inventoryOpen = false;
            return true;
        }

        const types = Object.keys(ITEM_DATA);
        const cols = 5;
        const size = 82;
        const gap = 20;
        const totalW = cols * size + (cols - 1) * gap;
        const startX = WIDTH / 2 - totalW / 2;
        const iconY = 185;
        types.forEach((type, index) => {
            const ix = startX + index * (size + gap);
            if (isInsideRect(x, y, { x: ix, y: iconY, w: size, h: size })) {
                openInventoryDetail(type);
            }
        });
        return true;
    }

    if (shopOpen) {
        const panel = getShopPanelRect();
        const types = ["timeClock", "energyShield", "pathGuide", "firstAid", "energyRecovery"];
        const pageCount = Math.max(1, Math.ceil(types.length / SHOP_PAGE_SIZE));
        const pageTypes = types.slice(shopPage * SHOP_PAGE_SIZE, (shopPage + 1) * SHOP_PAGE_SIZE);

        if (isInsideRect(x, y, { x: WIDTH / 2 - 80, y: 550, w: 160, h: 26 })) {
            shopOpen = false;
            return true;
        }
        if (isInsideRect(x, y, { x: panel.x + 8, y: 276, w: 48, h: 48 })) {
            shopPage = (shopPage - 1 + pageCount) % pageCount;
            return true;
        }
        if (isInsideRect(x, y, { x: panel.x + panel.w - 56, y: 276, w: 48, h: 48 })) {
            shopPage = (shopPage + 1) % pageCount;
            return true;
        }
        if (x < panel.x || x > panel.x + panel.w || y < panel.y || y > panel.y + panel.h) {
            shopOpen = false;
            return true;
        }

        const rowStart = 205;
        pageTypes.forEach((type, index) => {
            const cy = rowStart + index * 108;
            if (isInsideRect(x, y, { x: panel.x + 430, y: cy - 25, w: 30, h: 34 })) adjustPurchaseQuantity(type, -1);
            if (isInsideRect(x, y, { x: panel.x + 464, y: cy - 25, w: 50, h: 34 })) return;
            if (isInsideRect(x, y, { x: panel.x + 518, y: cy - 25, w: 30, h: 34 })) adjustPurchaseQuantity(type, 1);
            if (isInsideRect(x, y, { x: panel.x + 550, y: cy - 25, w: 90, h: 34 })) buyItem(type);
        });
        return true;
    }

    if (!settingsOpen && isInsideRect(x, y, { x: 570, y: 350, w: 200, h: 38 })) {
        openMultiplayerMenu();
        return true;
    }

    if (!settingsOpen && isInsideRect(x, y, gear)) {
        settingsOpen = true;
        requestSettingsRender();
        return true;
    }

    if (!settingsOpen) return false;

    const panel = { x: 70, y: 20, w: 660, h: 560 };

    if (isInsideRect(x, y, { x: WIDTH / 2 - 80, y: 538, w: 160, h: 34 })) {
        settingsOpen = false;
        return true;
    }

    if (
        x < panel.x ||
        x > panel.x + panel.w ||
        y < panel.y ||
        y > panel.y + panel.h
    ) {
        settingsOpen = false;
        return true;
    }

    const rows = [
        { key: "wall", list: WALL_COLORS },
        { key: "background", list: BACKGROUND_COLORS },
        { key: "dangerSkin", list: DANGER_SKINS },
        { key: "streakEffect", list: STREAK_EFFECTS }
    ];

    const settingRows = [
        { key: "wall", list: WALL_COLORS, centerY: 112 },
        { key: "background", list: BACKGROUND_COLORS, centerY: 180 },
        { key: "dangerSkin", list: DANGER_SKINS, centerY: 305 },
        { key: "streakEffect", list: STREAK_EFFECTS, centerY: 440 }
    ];

    settingRows.forEach((row) => {
        const centerY = row.centerY;

        /* 사용자 지정은 가운데 문구/색상 영역을 눌렀을 때만 입력창을 엽니다. */
        if (
            (row.key === "wall" || row.key === "background") &&
            row.list[visualSettings[row.key]]?.custom &&
            isInsideRect(x, y, {
                x: WIDTH / 2 - 155,
                y: centerY - 21,
                w: 310,
                h: 42
            })
        ) {
            setCustomColor(row.key);
            return;
        }

        if (isInsideRect(x, y, {
            x: panel.x + 24,
            y: centerY - 21,
            w: 62,
            h: 42
        })) {
            cycleSetting(row.key, row.list, -1);
            return;
        }

        if (isInsideRect(x, y, {
            x: panel.x + panel.w - 86,
            y: centerY - 21,
            w: 62,
            h: 42
        })) {
            cycleSetting(row.key, row.list, 1);
        }
    });

    return true;
}

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(box.x, box.y, box.w, box.h, 18);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#f3f5f7";
    ctx.font = "bold 23px Pretendard, Noto Sans KR, sans-serif";
    ctx.fillText("🌀 에너지 복구 장치", WIDTH / 2, 240);

    ctx.fillStyle = "#aeb8c4";
    ctx.font = "14px Pretendard, Noto Sans KR, sans-serif";
    ctx.fillText("맵 넘기기를 모두 소모했습니다. 몇 개 사용할까요?", WIDTH / 2, 275);

    const canUse2 = itemInventory.energyRecovery >= 2;
    drawSettingsButton(205, 310, 160, 42, "1개 사용 · +3");
    if (canUse2) {
        drawSettingsButton(435, 310, 160, 42, "2개 사용 · +5");
    } else {
        drawSettingsButton(435, 310, 160, 42, "2개 사용 불가");
    }

    ctx.fillStyle = "#7f8b99";
    ctx.font = "12px Pretendard, Noto Sans KR, sans-serif";
    ctx.fillText(`현재 보유량: ${itemInventory.energyRecovery}개 · 이 게임에서는 1회만 사용 가능`, WIDTH / 2, 370);
    ctx.restore();
}

/* =========================================================
   렌더링
========================================================= */

function draw(now = performance.now()) {

    if (
        gameState === "start"
    ) {

        // 설정 화면은 정적인 UI이므로 내용이 바뀔 때만 다시 그립니다.
        // 미리보기의 모양/강도는 그대로 유지하면서, 매 프레임 반복되는
        // Canvas 연산을 없애 화살표 입력 시 발생하는 순간적인 지연을 줄입니다.
        if (settingsOpen) {
            const previewFrameInterval = 1000 / 24;

            if (
                !settingsRenderRequested &&
                now - lastSettingsRenderTime < previewFrameInterval
            ) {
                return;
            }

            settingsRenderRequested = false;
            lastSettingsRenderTime = now;
            drawBackground();
            drawSettingsPanel();
        } else {
            drawStartScreen();
        }

        return;
    }


    if (
        gameState === "gameover"
    ) {

        drawGameOverScreen();

        return;
    }

    if (
        gameState === "multiplayerResult" ||
        gameState === "multiplayerWaitingResult"
    ) {

        drawMultiplayerResultScreen();

        return;
    }


    drawGame();
    drawEnergyRecoveryChoice();
}


/* =========================================================
   메인 루프
========================================================= */

function gameLoop(
    now
) {

    let delta =
        (
            now -
            lastTime
        ) / 1000;

    lastTime =
        now;

    delta =
        Math.min(
            delta,
            0.05
        );

    update(delta);

    draw(now);

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   초기 실행
========================================================= */

updateUI();

requestAnimationFrame(
    gameLoop
);

</script>
