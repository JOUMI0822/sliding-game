<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬라이딩</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #0b0e13;
    color: #f2f5f7;
    font-family: "Pretendard","Noto Sans KR",Arial,sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    min-height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
}

#gameWrapper {
    width: 800px;
    max-width: 100vw;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: 15px;
    touch-action: none;
    overscroll-behavior: none;
}

.topbar {
    width: 800px;
    max-width: 100vw;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 10px;
    background: #151a22;
    border: 1px solid #29303b;
    border-bottom: none;
    font-size: 14px;
    font-weight: 600;
}

.topbar > div {
    white-space: nowrap;
}

#equippedItemBox {
    width: 185px;
    height: 30px;
    min-width: 185px;
    border: 1px solid #46515f;
    border-radius: 9px;
    background: #10151c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    line-height: 1;
    overflow: hidden;
}

#itemInfo {
    width: 100%;
    color: #b8f0ff;
    font-size: 11px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 6px;
}

#itemWarning {
    width: 100%;
    color: #ffbd66;
    font-size: 8px;
    min-height: 0;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 4px;
}

#time {
    color: #f4f6f8;
}

#lives {
    color: #ff6672;
}

#clears {
    color: #7ddcff;
}

#mapSkips {
    color: #d9c7ff;
    letter-spacing: 1px;
}

canvas {
    display: block;
    width: 800px;
    height: 600px;
    max-width: 100vw;
    border: 1px solid #29303b;
    background: #0f1319;
    touch-action: none;
}

@media (max-width:820px) {
    .topbar {
        font-size: 10px;
        gap: 4px;
        padding: 6px 5px;
        min-height: 50px;
    }

    #equippedItemBox {
        width: 25vw;
        min-width: 92px;
        max-width: 150px;
        height: 30px;
        border-radius: 8px;
    }

    #itemInfo {
        font-size: 8px;
    }

    #itemWarning {
        font-size: 6px;
    }

    canvas {
        width: 100vw;
        height: auto;
        aspect-ratio: 4 / 3;
    }
}
</style>
</head>

<body>

<div id="gameWrapper">

    <div class="topbar">
        <div id="time">시간 20.0초</div>
        <div id="lives">목숨 ♥ ♥ ♥</div>
        <div id="clears">클리어 0회</div>
        <div id="equippedItemBox">
            <div id="itemInfo">아이템 미사용</div>
            <div id="itemWarning"></div>
        </div>
        <div id="mapSkips">맵 넘기기 ● ● ● ● ●</div>
    </div>

    <canvas id="game" width="800" height="600"></canvas>

</div>

<script>
"use strict";

/* =========================================================
   기본 설정
========================================================= */

const canvas = document.getElementById("game");
const gameWrapper = document.getElementById("gameWrapper");
const ctx = canvas.getContext("2d");

const CELL = 40;
const COLS = 20;
const ROWS = 15;

const WIDTH = 800;
const HEIGHT = 600;

const TIME_LIMIT = 20;

/* 클리어 횟수에 따른 제한 시간
   0~4회: 20초 / 5~9회: 17초 / 10~19회: 15초
   20~24회: 12초 / 25~29회: 10초 / 30회 이상: 7초
*/
function getStageTimeLimit() {
    if (clearCount >= 30) return 7;
    if (clearCount >= 25) return 10;
    if (clearCount >= 20) return 12;
    if (clearCount >= 10) return 15;
    if (clearCount >= 5) return 17;
    return 20;
}

const MAX_LIVES = 3;
const MAX_MAP_SKIPS = 5;

const START = {
    c: 1,
    r: 1
};

let stageStart = {
    c: START.c,
    r: START.r
};

const MAX_MAP_ATTEMPTS = 1200;
const MIN_REACHABLE_STATES = 28;
const MIN_PATH_LENGTH = 5;
const MIN_BRANCHING_STATES = 5;
const MAX_PREVIOUS_LAYOUTS = 180;


/* =========================================================
   게임 상태
========================================================= */

let gameState = "start";

/* =========================================================
   2인용 경쟁 모드 준비 상태
   - 현재는 방/코드/시드 UI까지 준비
   - 실제 기기 간 연결은 다음 단계에서 WebRTC + 시그널링 서버 연결
========================================================= */
let multiplayerOpen = false;
let multiplayerRole = null;
let multiplayerRoomCode = "";
let multiplayerSeed = 0;
let multiplayerOpponentName = "상대 플레이어";

/* =========================================================
   2인용 서버 실제 연결
========================================================= */
const MULTIPLAYER_SERVER_URL = "wss://sliding-multiplayer-server-1.onrender.com";
let multiplayerSocket = null;
let multiplayerConnected = false;
let multiplayerPeerJoined = false;
let multiplayerMatchActive = false;
let multiplayerResult = null;
let multiplayerStatus = "서버 연결 중...";
let multiplayerSendAccumulator = 0;
let multiplayerEliminatedSent = false;
let multiplayerMatchmaking = false;
let multiplayerRound = 0;
let multiplayerRoundTransition = false;
let multiplayerPlayerVisible = true;
let multiplayerPeerLeftDeadline = 0;
let multiplayerPeerLeftTimer = null;
let opponent = {
    x: 0, y: 0,
    targetX: 0, targetY: 0,
    c: 1, r: 1,
    visible: false
};

function multiplayerSend(data) {
    if (!multiplayerSocket || multiplayerSocket.readyState !== WebSocket.OPEN) return false;
    try { multiplayerSocket.send(JSON.stringify(data)); return true; } catch (error) { return false; }
}

function closeMultiplayerSocket() {
    if (multiplayerPeerLeftTimer) {
        clearInterval(multiplayerPeerLeftTimer);
        multiplayerPeerLeftTimer = null;
    }
    multiplayerPeerLeftDeadline = 0;
    multiplayerConnected = false;
    multiplayerPeerJoined = false;
    multiplayerMatchActive = false;
    multiplayerEliminatedSent = false;
    multiplayerMatchmaking = false;
    multiplayerRound = 0;
    multiplayerRoundTransition = false;
    if (multiplayerSocket) { try { multiplayerSocket.close(); } catch (error) {} }
    multiplayerSocket = null;
}

function resetOpponent() {
    opponent.x = player.x;
    opponent.y = player.y;
    opponent.targetX = player.x;
    opponent.targetY = player.y;
    opponent.c = player.c;
    opponent.r = player.r;
    opponent.visible = false;
}

function sendMultiplayerPosition(force = false) {
    if (!multiplayerMatchActive) return;
    if (!force && multiplayerSendAccumulator < 0.05) return;
    multiplayerSendAccumulator = 0;
    multiplayerSend({
        type: "position",
        c: player.c,
        r: player.r,
        x: player.x,
        y: player.y,
        moving: !!movement
    });
}

function startMultiplayerMatchmaking() {
    closeMultiplayerSocket();
    multiplayerRole = null;
    multiplayerRoomCode = "";
    multiplayerSeed = 0;
    multiplayerMatchmaking = false;
    multiplayerPeerJoined = false;
    multiplayerMatchActive = false;
    multiplayerStatus = "상대를 찾는 중...";
    updateUI();

    connectMultiplayerSocket(() => {
        multiplayerMatchmaking = true;
        multiplayerStatus = "상대를 찾는 중...";
        multiplayerSend({ type: "matchmake" });
        updateUI();
    });
}

function cancelMultiplayerMatchmaking() {
    multiplayerMatchmaking = false;
    multiplayerStatus = "매칭을 취소했습니다.";
    closeMultiplayerSocket();
    multiplayerOpen = true;
    multiplayerRole = null;
    updateUI();
}

function connectMultiplayerSocket(onConnected) {
    closeMultiplayerSocket();
    multiplayerStatus = "서버 연결 중...";
    let socket;
    try { socket = new WebSocket(MULTIPLAYER_SERVER_URL); }
    catch (error) { multiplayerStatus = "서버 연결에 실패했습니다."; updateUI(); return; }
    multiplayerSocket = socket;

    socket.addEventListener("open", () => {
        if (multiplayerSocket !== socket) return;
        multiplayerConnected = true;
        multiplayerStatus = "서버 연결 완료";
        onConnected();
        updateUI();
    });
    socket.addEventListener("message", event => {
        let data;
        try { data = JSON.parse(event.data); } catch (error) { return; }
        handleMultiplayerMessage(data);
    });
    socket.addEventListener("error", () => {
        if (multiplayerSocket !== socket) return;
        multiplayerStatus = "서버 연결 오류";
        updateUI();
    });
    socket.addEventListener("close", () => {
        if (multiplayerSocket !== socket) return;
        multiplayerConnected = false;
        multiplayerPeerJoined = false;
        if (multiplayerMatchActive) {
            multiplayerMatchActive = false;
            gameState = "start";
            multiplayerOpen = false;
            setMessage("상대 플레이어와의 연결이 끊어졌습니다.");
        } else if (multiplayerMatchmaking) {
            multiplayerStatus = "매칭 서버 연결이 종료되었습니다.";
            multiplayerMatchmaking = false;
            multiplayerOpen = true;
            multiplayerRole = null;
        } else {
            multiplayerStatus = "서버 연결 종료";
        }
        updateUI();
    });
}

function handleMultiplayerMessage(data) {
    if (data.type === "error") {
        multiplayerStatus = data.message || "서버 오류";
        window.alert(multiplayerStatus);
        return;
    }
    if (data.type === "matchFound") {
        multiplayerMatchmaking = false;
        multiplayerRole = data.role === "guest" ? "guest" : "host";
        // 빠른 대전은 내부 방 코드를 사용자에게 표시하지 않습니다.
        multiplayerRoomCode = "";
        multiplayerPeerJoined = true;
        multiplayerStatus = "상대 플레이어를 찾았습니다. 경기 준비 중...";
        multiplayerOpen = false;
        updateUI();

        // 자동 매칭에서는 방장 역할을 받은 클라이언트가 즉시 첫 라운드를 시작합니다.
        if (multiplayerRole === "host") {
            startMultiplayerMatch();
        }
        return;
    }
    if (data.type === "roomCreated") {
        multiplayerMatchmaking = false;
        multiplayerRoomCode = String(data.room || multiplayerRoomCode);
        multiplayerStatus = "방 생성 완료 · 친구를 기다리는 중";
        multiplayerPeerJoined = false;
        updateUI();
        return;
    }
    if (data.type === "roomJoined") {
        multiplayerMatchmaking = false;
        multiplayerRoomCode = String(data.room || multiplayerRoomCode);
        multiplayerStatus = "방 참가 완료 · 방장의 시작을 기다리는 중";
        updateUI();
        return;
    }
    if (data.type === "peerJoined") {
        multiplayerPeerJoined = true;
        multiplayerPeerLeftDeadline = 0;
        if (multiplayerPeerLeftTimer) {
            clearInterval(multiplayerPeerLeftTimer);
            multiplayerPeerLeftTimer = null;
        }
        if (multiplayerMatchActive || gameState === "multiplayerWaitingResult") {
            multiplayerStatus = "상대 플레이어가 재접속했습니다. 경기를 계속합니다.";
            setMessage("상대 플레이어가 재접속했습니다. 경기를 계속합니다.");
        } else {
            multiplayerStatus = "상대 플레이어가 참가했습니다. 경기 시작을 눌러주세요.";
        }
        updateUI();
        return;
    }
    if (data.type === "peerLeft") {
        multiplayerPeerJoined = false;
        multiplayerPeerLeftDeadline = Date.now() + 10000;
        if (multiplayerPeerLeftTimer) clearInterval(multiplayerPeerLeftTimer);

        const updatePeerLeftCountdown = () => {
            if (multiplayerPeerLeftDeadline <= 0) return;
            const remain = Math.max(0, (multiplayerPeerLeftDeadline - Date.now()) / 1000);
            if (remain <= 0) {
                clearInterval(multiplayerPeerLeftTimer);
                multiplayerPeerLeftTimer = null;
                return;
            }
            const text = `상대 플레이어가 나갔습니다. ${Math.ceil(remain)}초 동안 재접속을 기다립니다...`;
            multiplayerStatus = text;
            setMessage(text);
            updateUI();
        };

        updatePeerLeftCountdown();
        multiplayerPeerLeftTimer = setInterval(updatePeerLeftCountdown, 100);
        return;
    }
    if (data.type === "playerLeftTimeout") {
        multiplayerPeerLeftDeadline = 0;
        if (multiplayerPeerLeftTimer) {
            clearInterval(multiplayerPeerLeftTimer);
            multiplayerPeerLeftTimer = null;
        }
        multiplayerPeerJoined = false;
        multiplayerMatchActive = false;
        multiplayerResult = data.winner || multiplayerResult || "draw";
        gameState = "multiplayerResult";
        movement = null;
        multiplayerOpen = false;
        setMessage(
            multiplayerResult === multiplayerRole ? "승리했습니다!" :
            multiplayerResult === "draw" ? "무승부입니다." : "패배했습니다."
        );
        updateUI();
        return;
    }
    if (data.type === "position") {
        if (!multiplayerMatchActive) return;
        const x = Number(data.x), y = Number(data.y);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        opponent.targetX = x;
        opponent.targetY = y;
        opponent.c = Number(data.c) || 0;
        opponent.r = Number(data.r) || 0;
        opponent.visible = true;
        return;
    }
    if (data.type === "matchStart") {
        if (multiplayerRole !== "guest") return;
        multiplayerMatchActive = true;
        multiplayerResult = null;
        multiplayerEliminatedSent = false;
        multiplayerRoundTransition = false;
        multiplayerPlayerVisible = true;
        multiplayerSeed = Number(data.seed) || 0;
        multiplayerRound = Number(data.round) || (multiplayerRound + 1);
        multiplayerOpen = false;
        clearTimeout(roundTimer);
        settingsOpen = false;

        const firstRound = multiplayerRound === 1;
        if (firstRound) {
            lives = MAX_LIVES;
            clearCount = 0;
            clearStreak = 0;
            maxClearStreak = 0;
            mapSkips = MAX_MAP_SKIPS;
            stageStart = { c: START.c, r: START.r };
            recordSavedForRun = false;
            runStartTime = new Date();
            activateItemForRun();
            resetRecoil();
            flash.alpha = 0;
        }

        gameState = "playing";
        remainingTime = getStageTimeLimit() + activeTimeBonus;
        stageStart = data.startPosition && Number.isFinite(Number(data.startPosition.c)) && Number.isFinite(Number(data.startPosition.r))
            ? { c: Number(data.startPosition.c), r: Number(data.startPosition.r) }
            : { c: START.c, r: START.r };
        walls = new Set(Array.isArray(data.walls) ? data.walls.map(String) : []);
        goal = data.goal ? { c: Number(data.goal.c), r: Number(data.goal.r) } : null;
        dangers = new Set(Array.isArray(data.dangers) ? data.dangers.map(String) : []);
        resetPlayer();
        mapTransition.active = false;
        pathGuideUses = 0;
        pathGuidePath = [];
        if (activeItem === "pathGuide") { showPathGuide(); pathGuideUses = 1; }
        resetOpponent();
        sendMultiplayerPosition(true);
        setMessage(multiplayerRound === 1 ? "경기 시작!" : `다음 맵 · ${multiplayerRound}라운드`);
        updateUI();
        return;
    }
    if (data.type === "roundWon") {
        if (!multiplayerMatchActive) return;
        if (Number(data.round) !== multiplayerRound) return;
        if (multiplayerRoundTransition) return;

        multiplayerRoundTransition = true;
        multiplayerPlayerVisible = true;
        const winner = data.winner || "draw";

        if (winner === multiplayerRole) {
            clearCount++;
            clearStreak++;
            maxClearStreak = Math.max(maxClearStreak, clearStreak);
            allTimeBestStreak = Math.max(allTimeBestStreak, clearStreak);
            coins++;
            saveCoins();
            if (clearCount > maxClearCount) {
                maxClearCount = clearCount;
                localStorage.setItem("slidingMazeMaxClearCount", String(maxClearCount));
            }
            try {
                localStorage.setItem("slideMazeBestStreak", String(allTimeBestStreak));
            } catch (error) {}
            if (activeItem === "energyShield" && clearCount % 3 === 0) {
                shieldCharges++;
            }
            if (activeItem === "firstAid" && clearCount % 4 === 0) {
                firstAidCharged = true;
            }
        } else if (winner !== "draw") {
            clearStreak = 0;
        }

        movement = null;
        if (multiplayerRole === "host") {
            startNextMultiplayerRound(
                data.nextStart && Number.isFinite(Number(data.nextStart.c)) && Number.isFinite(Number(data.nextStart.r))
                    ? { c: Number(data.nextStart.c), r: Number(data.nextStart.r) }
                    : { c: player.c, r: player.r }
            );
        } else {
            gameState = "multiplayerWaitingRound";
            setMessage(winner === multiplayerRole ? "클리어! 다음 맵을 준비합니다." : "상대가 먼저 클리어했습니다. 다음 맵을 기다리는 중...");
            updateUI();
        }
        return;
    }
    if (data.type === "matchOver") {
        if (!multiplayerMatchActive && gameState !== "multiplayerWaitingResult") return;
        multiplayerMatchActive = false;
        multiplayerResult = data.winner || "draw";
        gameState = "multiplayerResult";
        movement = null;
        multiplayerOpen = false;
        setMessage(
            multiplayerResult === multiplayerRole ? "승리했습니다!" :
            multiplayerResult === "draw" ? "무승부입니다." : "패배했습니다."
        );
        updateUI();
    }
}

function startMultiplayerMatch() {
    if (multiplayerRole !== "host" || !multiplayerConnected || !multiplayerPeerJoined) return;
    multiplayerSeed = generateMatchSeed();
    multiplayerRound = 1;
    multiplayerMatchActive = true;
    multiplayerResult = null;
    multiplayerEliminatedSent = false;
    multiplayerRoundTransition = false;
    multiplayerOpen = false;
    startNewGame();
    multiplayerSend({
        type: "matchStart", round: multiplayerRound, seed: multiplayerSeed,
        startPosition: { c: stageStart.c, r: stageStart.r },
        walls: [...walls], goal: goal ? { c: goal.c, r: goal.r } : null,
        dangers: [...dangers]
    });
    resetOpponent(); sendMultiplayerPosition(true);
}

function startNextMultiplayerRound(nextStart = { c: player.c, r: player.r }) {
    if (multiplayerRole !== "host" || !multiplayerMatchActive) return;

    clearTimeout(roundTimer);
    multiplayerRound++;
    multiplayerSeed = generateMatchSeed();
    multiplayerEliminatedSent = false;
    multiplayerRoundTransition = false;
    multiplayerPlayerVisible = true;
    stageStart = {
        c: Number(nextStart.c),
        r: Number(nextStart.r)
    };

    startRound();

    multiplayerSend({
        type: "matchStart", round: multiplayerRound, seed: multiplayerSeed,
        startPosition: { c: stageStart.c, r: stageStart.r },
        walls: [...walls], goal: goal ? { c: goal.c, r: goal.r } : null,
        dangers: [...dangers]
    });
    resetOpponent();
    sendMultiplayerPosition(true);
}

function sendMultiplayerEliminated() {
    if (!multiplayerMatchActive) return;

    // 목숨이 남아 있으면 완전 탈락이 아닙니다.
    // 현재 맵에서 캐릭터만 잠시 숨긴 뒤 같은 맵에서 다시 시작합니다.
    multiplayerPlayerVisible = false;
    movement = null;
    multiplayerSend({
        type: "eliminated",
        round: multiplayerRound,
        livesRemaining: Math.max(0, lives),
        position: { c: player.c, r: player.r }
    });

    if (lives > 0) {
        multiplayerEliminatedSent = false;
        gameState = "multiplayerRespawning";
        setMessage(`탈락! 목숨 ${lives}개 남음 · 잠시 후 다시 시작합니다.`);
        updateUI();

        clearTimeout(roundTimer);
        roundTimer = setTimeout(() => {
            if (!multiplayerMatchActive || lives <= 0) return;

            resetPlayer();
            multiplayerPlayerVisible = true;
            gameState = "playing";
            remainingTime = TIME_LIMIT + activeTimeBonus;
            resetOpponent();
            sendMultiplayerPosition(true);
            setMessage(`다시 시작! 목숨 ${lives}개 남음`);
            updateUI();
        }, 850);
        return;
    }

    // 목숨이 0개일 때만 완전 탈락 처리합니다.
    multiplayerEliminatedSent = true;
    multiplayerRoundTransition = false;
    gameState = "multiplayerWaitingResult";
    opponent.visible = false;
    setMessage("목숨을 모두 잃었습니다. 상대 플레이어의 결과를 기다리는 중...");
    updateUI();
}

function generateRoomCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 5; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
}

function generateMatchSeed() {
    return Math.floor(Math.random() * 900000) + 100000;
}

function openMultiplayerMenu() {
    multiplayerOpen = true;
    multiplayerRole = null;
    multiplayerRoomCode = "";
    multiplayerSeed = 0;
}

function closeMultiplayerMenu() {
    multiplayerOpen = false;
    multiplayerRole = null;
    closeMultiplayerSocket();
}

function createMultiplayerRoom() {
    multiplayerRole = "host";
    multiplayerRoomCode = generateRoomCode();
    multiplayerSeed = generateMatchSeed();
    connectMultiplayerSocket(() => multiplayerSend({ type: "create", room: multiplayerRoomCode }));
}

function joinMultiplayerRoom() {
    const code = window.prompt("친구에게 받은 5자리 방 코드를 입력하세요.");
    if (!code) return;

    const normalized = code.trim().toUpperCase();
    if (!/^[A-Z0-9]{5}$/.test(normalized)) {
        window.alert("방 코드는 영문/숫자 5자리입니다.");
        return;
    }

    multiplayerRole = "guest";
    multiplayerRoomCode = normalized;
    multiplayerSeed = 0;
    connectMultiplayerSocket(() => multiplayerSend({ type: "join", room: multiplayerRoomCode }));
}

function drawMultiplayerMenu() {
    ctx.save();

    ctx.fillStyle = "rgba(5,8,13,0.90)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    const panel = { x: 135, y: 80, w: 530, h: 440 };

    ctx.fillStyle = "#151b24";
    ctx.strokeStyle = "#425063";
    ctx.lineWidth = 2;

function isValidHexColor(value) {
    return (
        typeof value === "string" &&
        /^#[0-9a-fA-F]{6}$/.test(value.trim())
    );
}

function getWallColor() {
    if (isValidHexColor(visualSettings.customWall)) {
        return visualSettings.customWall;
    }

    const selected = WALL_COLORS[visualSettings.wall];

    if (selected && selected.custom) {
        return WALL_COLORS[WALL_COLORS.length - 2].value;
    }

    return selected?.value || WALL_COLORS[0].value;
}

function getBackgroundColor() {
    if (isValidHexColor(visualSettings.customBackground)) {
        return visualSettings.customBackground;
    }

    const selected = BACKGROUND_COLORS[visualSettings.background];

    if (selected && selected.custom) {
        return BACKGROUND_COLORS[BACKGROUND_COLORS.length - 2].value;
    }

    return selected?.value || BACKGROUND_COLORS[0].value;
}

function setCustomColor(key) {

/* =========================================================

========================================================= */

function clamp(value, min, max) {
    return Math.max(
        min,
        Math.min(max, value)
    );
}


function keyOf(c, r) {
    return `${c},${r}`;
}


function parseKey(key) {

    const [
        c,
        r
    ] =
        key
            .split(",")
            .map(Number);

    return {
        c,
        r
    };
}


function isInside(c, r) {
    return (
        c >= 0 &&
        c < COLS &&
        r >= 0 &&
        r < ROWS
    );
}


function isBoundary(c, r) {
    return (
        c === 0 ||
        r === 0 ||
        c === COLS - 1 ||
        r === ROWS - 1
    );
}


function randomInt(min, max) {
    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;
}


function setMessage(text) {
    messageText = text;

function openEnergyRecoveryChoice() {
    if (
        activeItem !== "energyRecovery" ||
        energyRecoveryUsed ||
        energyRecoveryChoiceOpen ||
        mapSkips > 0 ||
        itemInventory.energyRecovery <= 0
    ) {
        return false;
    }

    energyRecoveryChoiceOpen = true;
    return true;
}

function useEnergyRecovery(amount) {
    if (
        activeItem !== "energyRecovery" ||
        energyRecoveryUsed ||
        !energyRecoveryChoiceOpen ||
        mapSkips > 0
    ) {
        return false;
    }

    amount = Math.max(1, Math.min(2, amount));

    if (itemInventory.energyRecovery < amount) {
        return false;
    }

    const recovered = amount === 1 ? 3 : 5;

    itemInventory.energyRecovery -= amount;
    mapSkips = Math.min(MAX_MAP_SKIPS, recovered);
    energyRecoveryUsed = true;
    energyRecoveryChoiceOpen = false;

    saveItemInventory();
    showItemWarning(`에너지 복구 장치 ${amount}개 사용 · 맵 넘기기 ${mapSkips}개 회복`);
    updateUI();
    return true;
}

function getMaxAffordableQuantity(type) {
    const price = ITEM_PRICES[type];
    if (!price || coins < price) return 0;
    return Math.floor(coins / price);
}

function getPurchaseQuantity(type) {
    const max = getMaxAffordableQuantity(type);
    if (max <= 0) return 0;
    purchaseQuantities[type] = Math.max(1, Math.min(max, purchaseQuantities[type] || 1));
    return purchaseQuantities[type];
}

function adjustPurchaseQuantity(type, direction) {
    const max = getMaxAffordableQuantity(type);
    if (max <= 0) {
        purchaseQuantities[type] = 0;
        return;
    }
    purchaseQuantities[type] = Math.max(1, Math.min(max, (purchaseQuantities[type] || 1) + direction));
}

function buyItem(type) {
    const price = ITEM_PRICES[type];
    const quantity = getPurchaseQuantity(type);
    if (!quantity || coins < price * quantity) {
        showItemWarning("재화가 부족합니다.");
        return;
    }

    const totalCost = price * quantity;
    coins -= totalCost;
    itemInventory[type] += quantity;
    saveItemInventory();
    saveCoins();

    if (type === "timeClock" && !selectedItem) {
        selectedTimeClocks = Math.min(5, Math.max(1, itemInventory.timeClock));
    }

    showItemWarning(`${ITEM_DATA[type].name} ${quantity}개 구매 완료 · ${coins}코인 남음`);
    purchaseQuantities[type] = Math.min(purchaseQuantities[type], Math.max(1, getMaxAffordableQuantity(type) || 1));
}

function equipItem(type) {
    if (itemInventory[type] <= 0) {
        showItemWarning("해당 아이템이 없습니다.");
        return;
    }

    if (selectedItem === type) {
        selectedItem = null;
        return;
    }

    selectedItem = type;
    if (type === "timeClock") {
        selectedTimeClocks = Math.max(1, Math.min(5, itemInventory.timeClock));
    }
    if (type === "energyRecovery") {
        selectedEnergyRecovery =
            Math.max(1, Math.min(2, itemInventory.energyRecovery));
    }
}

function unequipItem() {
    selectedItem = null;
}

function adjustSelectedTimeClocks(direction) {
    if (itemInventory.timeClock <= 0) return;
    selectedTimeClocks = Math.max(1, Math.min(5, selectedTimeClocks + direction));
    selectedItem = "timeClock";
}

function adjustSelectedEnergyRecovery(direction) {
    if (itemInventory.energyRecovery <= 0) return;
    selectedEnergyRecovery = Math.max(1, Math.min(2, selectedEnergyRecovery + direction));
    selectedEnergyRecovery = Math.min(selectedEnergyRecovery, itemInventory.energyRecovery);
    selectedItem = "energyRecovery";
}

function openInventoryDetail(type) {
    inventoryDetailType = type;
    inventoryOpen = true;
}

function closeInventoryDetail() {
    inventoryDetailType = null;
}

function getGuidePath() {
    if (!goal) {
        return [];
    }

    const graph = buildSlideGraph(walls);
    const startKey = keyOf(player.c, player.r);
    const goalKey = keyOf(goal.c, goal.r);

    const queue = [startKey];
    const previous = new Map([[startKey, null]]);

    while (queue.length) {
        const current = queue.shift();
        if (current === goalKey) break;

        for (const next of graph.get(current) || []) {
            if (dangers.has(next) || previous.has(next)) continue;
            previous.set(next, current);
            queue.push(next);
        }
    }

    if (!previous.has(goalKey)) {
        return [];
    }

    const result = [];
    let current = goalKey;

    while (current !== null) {
        result.push(parseKey(current));
        current = previous.get(current);
    }

    return result.reverse();
}

function showPathGuide() {
    if (gameState !== "playing" && gameState !== "transition") {
        return false;
    }

    pathGuidePath = getGuidePath();
    if (!pathGuidePath.length) {
        return false;
    }

    const guideNow = performance.now();
    pathGuideVisibleUntil = guideNow + 1500;
    pathGuideFadeStart = 0;
    pathGuideAutoFadeAt = guideNow + 1320;
    return true;
}

function useSecondPathGuide() {
    if (activeItem !== "pathGuide") {
        return false;
    }

    if (pathGuideUses >= 2) {
        return false;
    }

    if (pathGuideUses === 0) {
        return false;
    }

    if (itemInventory.pathGuide <= 0) {
        if (!pathGuideZeroWarningShown) {
            pathGuideZeroWarningShown = true;
            showItemWarning("경로 안내 장치 보유량 0");
        }
        return false;
    }

    if (showPathGuide()) {
        pathGuideUses = 2;
        itemInventory.pathGuide--;
        saveItemInventory();

        if (itemInventory.pathGuide <= 0 && !pathGuideZeroWarningShown) {
            pathGuideZeroWarningShown = true;
            showItemWarning("경로 안내 장치 보유량 0");
        }

        return true;
    }

    return false;
}

function tryAutoFirstAid() {
    if (activeItem !== "firstAid" || !firstAidCharged || lives >= MAX_LIVES) {
        return false;
    }

    lives = Math.min(MAX_LIVES, lives + 1);
    firstAidCharged = false;
    showItemWarning("응급 처치 장치 발동 · 목숨 +1");
    updateUI();
    return true;
}


/* =========================================================
   반동 / 흔들림
========================================================= */

function applyRecoil(
    dirX,
    dirY,
    strength,
    shakePower,
    duration
) {

    recoil.vx =
        -dirX * strength;

    recoil.vy =
        -dirY * strength;

    shake.power =
        Math.max(
            shake.power,
            shakePower
        );

    shake.time =
        Math.max(
            shake.time,
            duration
        );
}


function applyImpactRecoil(
    strength,
    shakePower,
    duration
) {

    const angle =
        Math.random() *
        Math.PI * 2;

    recoil.vx =
        Math.cos(angle) *
        strength;

    recoil.vy =
        Math.sin(angle) *
        strength;

    shake.power =
        Math.max(
            shake.power,
            shakePower
        );

    shake.time =
        Math.max(
            shake.time,
            duration
        );
}


function updateRecoil(delta) {

    recoil.x +=
        recoil.vx *
        delta;

    recoil.y +=
        recoil.vy *
        delta;

    const damping =
        Math.pow(
            recoil.damping,
            delta * 60
        );

    recoil.vx *= damping;
    recoil.vy *= damping;

    recoil.vx +=
        -recoil.x *
        0.55 *
        delta *
        60;

    recoil.vy +=
        -recoil.y *
        0.55 *
        delta *
        60;

    recoil.x =
        clamp(
            recoil.x,
            -18,
            18
        );

    recoil.y =
        clamp(
            recoil.y,
            -18,
            18
        );
}


function resetRecoil() {

    recoil.x = 0;
    recoil.y = 0;
    recoil.vx = 0;
    recoil.vy = 0;
}


function getShakeOffset() {

    if (shake.time <= 0) {
        return {
            x: 0,
            y: 0
        };
    }

    const amount =
        shake.power *
        Math.min(
            1,
            shake.time / 0.2
        );

    return {
        x:
            (Math.random() * 2 - 1) *
            amount,

        y:
            (Math.random() * 2 - 1) *
            amount
    };
}


/* =========================================================
   벽 생성
========================================================= */

function createBoundaryWalls() {

    const result =
        new Set();

    for (
        let r = 0;
        r < ROWS;
        r++
    ) {

        for (
            let c = 0;
            c < COLS;
            c++
        ) {

            if (
                isBoundary(c, r)
            ) {
                result.add(
                    keyOf(c, r)
                );
            }
        }
    }

    return result;
}


function canPlaceRectangle(
    wallSet,
    x,
    y,
    w,
    h
) {

    const protectedCells = [
        [
            stageStart.c,
            stageStart.r
        ],

        [
            stageStart.c + 1,
            stageStart.r
        ],

        [
            stageStart.c,
            stageStart.r + 1
        ]
    ];

    for (
        let r = y;
        r < y + h;
        r++
    ) {

        for (
            let c = x;
            c < x + w;
            c++
        ) {

            if (
                !isInside(c, r)
            ) {
                return false;
            }

            if (
                isBoundary(c, r)
            ) {
                return false;
            }

            if (
                protectedCells.some(
                    ([pc, pr]) =>
                        pc === c &&
                        pr === r
                )
            ) {
                return false;
            }

            if (
                wallSet.has(
                    keyOf(c, r)
                )
            ) {
                return false;
            }
        }
    }

    return true;
}


function createRandomWalls() {

    const difficulty =
        Math.min(
            10,
            Math.floor(
                clearCount / 3
            )
        );

    const minRectangles =
        20 +
        difficulty * 2;

    const maxRectangles =
        31 +
        difficulty * 3;

    const maxDensity =
        Math.min(
            0.56,
            0.38 +
            difficulty * 0.018
        );

    const result =
        createBoundaryWalls();

    const rectangleCount =
        randomInt(
            minRectangles,
            maxRectangles
        );

    for (
        let attempt = 0;
        attempt < rectangleCount * 15;
        attempt++
    ) {

        if (
            result.size >
            COLS * ROWS *
            maxDensity
        ) {
            break;
        }

        const w =
            randomInt(
                1,
                Math.min(
                    5,
                    4 +
                    Math.floor(
                        difficulty / 3
                    )
                )
            );

        const h =
            randomInt(
                1,
                Math.min(
                    4,
                    3 +
                    Math.floor(
                        difficulty / 4
                    )
                )
            );

        const x =
            randomInt(
                1,
                COLS - w - 2
            );

        const y =
            randomInt(
                1,
                ROWS - h - 2
            );

        if (
            canPlaceRectangle(
                result,
                x,
                y,
                w,
                h
            )
        ) {

            for (
                let r = y;
                r < y + h;
                r++
            ) {

                for (
                    let c = x;
                    c < x + w;
                    c++
                ) {

                    result.add(
                        keyOf(c, r)
                    );
                }
            }
        }
    }

    return result;
}


/* =========================================================
   슬라이딩 이동 계산
========================================================= */

function getSlideDestination(
    c,
    r,
    dc,
    dr,
    wallSet = walls
) {

    let nc = c;
    let nr = r;

    while (true) {

        const nextC =
            nc + dc;

        const nextR =
            nr + dr;

        if (
            !isInside(
                nextC,
                nextR
            ) ||
            wallSet.has(
                keyOf(
                    nextC,
                    nextR
                )
            )
        ) {
            break;
        }

        nc = nextC;
        nr = nextR;
    }

    return {
        c: nc,
        r: nr
    };
}


function getSlideMoves(
    c,
    r,
    wallSet = walls
) {

    const directions = [
        {
            dc: 0,
            dr: -1
        },
        {
            dc: 0,
            dr: 1
        },
        {
            dc: -1,
            dr: 0
        },
        {
            dc: 1,
            dr: 0
        }
    ];

    const result = [];

    for (
        const direction
        of directions
    ) {

        const destination =
            getSlideDestination(
                c,
                r,
                direction.dc,
                direction.dr,
                wallSet
            );

        if (
            destination.c !== c ||
            destination.r !== r
        ) {

            result.push({
                from: {
                    c,
                    r
                },

                to: destination,

                dc: direction.dc,
                dr: direction.dr
            });
        }
    }

    return result;
}


/* =========================================================
   슬라이딩 그래프
========================================================= */

function buildSlideGraph(
    wallSet = walls
) {

    const graph =
        new Map();

    for (
        let r = 1;
        r < ROWS - 1;
        r++
    ) {

        for (
            let c = 1;
            c < COLS - 1;
            c++
        ) {

            const current =
                keyOf(c, r);

            if (
                wallSet.has(current)
            ) {
                continue;
            }

            const moves =
                getSlideMoves(
                    c,
                    r,
                    wallSet
                );

            graph.set(
                current,
                moves.map(
                    move =>
                        keyOf(
                            move.to.c,
                            move.to.r
                        )
                )
            );
        }
    }

    return graph;
}


function getReachableStates(
    graph,
    startKey
) {

    const visited =
        new Set();

    const queue = [
        startKey
    ];

    visited.add(startKey);

    while (
        queue.length > 0
    ) {

        const current =
            queue.shift();

        const neighbors =
            graph.get(current) || [];

        for (
            const next
            of neighbors
        ) {

            if (
                visited.has(next)
            ) {
                continue;
            }

            visited.add(next);
            queue.push(next);
        }
    }

    return visited;
}


function buildReverseGraph(
    graph
) {

    const reverse =
        new Map();

    for (
        const [
            from,
            destinations
        ]
        of graph.entries()
    ) {

        if (
            !reverse.has(from)
        ) {
            reverse.set(
                from,
                []
            );
        }

        for (
            const destination
            of destinations
        ) {

            if (
                !reverse.has(
                    destination
                )
            ) {

                reverse.set(
                    destination,
                    []
                );
            }

            reverse
                .get(destination)
                .push(from);
        }
    }

    return reverse;
}


function getStatesThatCanReachGoal(
    graph,
    goalKey
) {

    const reverse =
        buildReverseGraph(
            graph
        );

    const visited =
        new Set();

    const queue = [
        goalKey
    ];

    visited.add(goalKey);

    while (
        queue.length > 0
    ) {

        const current =
            queue.shift();

        const previousStates =
            reverse.get(current) || [];

        for (
            const previous
            of previousStates
        ) {

            if (
                visited.has(previous)
            ) {
                continue;
            }

            visited.add(previous);
            queue.push(previous);
        }
    }

    return visited;
}


function isMapFullyEscapable(
    graph,
    goalKey
) {

    const startKey =
        keyOf(
            stageStart.c,
            stageStart.r
        );

    const reachable =
        getReachableStates(
            graph,
            startKey
        );

    const canReachGoal =
        getStatesThatCanReachGoal(
            graph,
            goalKey
        );

    if (
        !canReachGoal.has(
            startKey
        )
    ) {

        return {
            valid: false,
            reason:
                "시작점에서 목표로 갈 수 없음"
        };
    }

    for (
        const state
        of reachable
    ) {

        if (
            !canReachGoal.has(
                state
            )
        ) {

            return {
                valid: false,
                reason:
                    `탈출 불가능 상태: ${state}`
            };
        }
    }

    return {
        valid: true,
        reachableCount:
            reachable.size
    };
}


/* =========================================================
   경로 탐색
========================================================= */

function getPathTo(
    graph,
    startKey,
    goalKey
) {

    const queue = [
        startKey
    ];

    const previous =
        new Map();

    previous.set(
        startKey,
        null
    );

    while (
        queue.length > 0
    ) {

        const current =
            queue.shift();

        if (
            current === goalKey
        ) {
            break;
        }

        const neighbors =
            graph.get(current) || [];

        for (
            const next
            of neighbors
        ) {

            if (
                previous.has(next)
            ) {
                continue;
            }

            previous.set(
                next,
                current
            );

            queue.push(next);
        }
    }

    if (
        !previous.has(
            goalKey
        )
    ) {
        return null;
    }

    const path = [];

    let current =
        goalKey;

    while (
        current !== null
    ) {

        path.push(current);

        current =
            previous.get(
                current
            );
    }

    path.reverse();

    return path;
}


/* =========================================================
   맵 분석
========================================================= */

function analyzeMap(
    graph,
    startKey
) {

    const reachable =
        getReachableStates(
            graph,
            startKey
        );

    let branchingStates = 0;
    let deadEndStates = 0;
    let maxDegree = 0;

    for (
        const state
        of reachable
    ) {

        const degree =
            (
                graph.get(state) ||
                []
            ).length;

        maxDegree =
            Math.max(
                maxDegree,
                degree
            );

        if (
            degree >= 2
        ) {
            branchingStates++;
        }

        if (
            degree === 0
        ) {
            deadEndStates++;
        }
    }

    return {
        reachable,
        reachableCount:
            reachable.size,
        branchingStates,
        deadEndStates,
        maxDegree
    };
}


/* =========================================================
   목표 후보
========================================================= */

function getGoalCandidates(
    graph,
    reachable,
    startKey
) {

    const difficulty =
        Math.min(
            10,
            Math.floor(
                clearCount / 3
            )
        );

    const candidates = [];

    for (
        const state
        of reachable
    ) {

        if (
            state === startKey
        ) {
            continue;
        }

        const path =
            getPathTo(
                graph,
                startKey,
                state
            );

        if (!path) {
            continue;
        }

        if (
            path.length - 1 >=
            (
                MIN_PATH_LENGTH +
                Math.floor(
                    difficulty / 2
                )
            )
        ) {

            candidates.push({
                key: state,
                pathLength:
                    path.length - 1
            });
        }
    }

    candidates.sort(
        (a, b) =>
            b.pathLength -
            a.pathLength
    );

    return candidates;
}


/* =========================================================
   위험 블록 생성
========================================================= */

function createDanger(
    graph,
    goalKey,
    safePath
) {

    const result =
        new Set();

    const safePathSet =
        new Set(
            safePath
        );

    const candidates = [];

    for (
        const state
        of graph.keys()
    ) {

        if (
            state ===
            keyOf(
                stageStart.c,
                stageStart.r
            )
        ) {
            continue;
        }

        if (
            state === goalKey
        ) {
            continue;
        }

        if (
            safePathSet.has(
                state
            )
        ) {
            continue;
        }

        candidates.push(state);
    }

    const difficulty =
        Math.min(
            10,
            Math.floor(
                clearCount / 3
            )
        );

    const dangerCount =
        randomInt(
            4 + difficulty,
            7 + difficulty * 2
        );

    for (
        let i = 0;
        i < dangerCount &&
        candidates.length > 0;
        i++
    ) {

        const index =
            randomInt(
                0,
                candidates.length - 1
            );

        const chosen =
            candidates.splice(
                index,
                1
            )[0];

        result.add(chosen);
    }

    return result;
}


function verifySafeGoalPath(
    graph,
    goalKey,
    dangers
) {

    const startKey =
        keyOf(
            stageStart.c,
            stageStart.r
        );

    const queue = [
        startKey
    ];

    const visited =
        new Set();

    visited.add(
        startKey
    );

    while (
        queue.length > 0
    ) {

        const current =
            queue.shift();

        if (
            current === goalKey
        ) {
            return true;
        }

        const neighbors =
            graph.get(current) || [];

        for (
            const next
            of neighbors
        ) {

            if (
                dangers.has(next)
            ) {
                continue;
            }

            if (
                visited.has(next)
            ) {
                continue;
            }

            visited.add(next);
            queue.push(next);
        }
    }

    return false;
}


/* =========================================================
   맵 서명
========================================================= */

function getLayoutSignature(
    wallSet,
    goalKey,
    dangerSet
) {

    const wallsPart =
        [...wallSet]
            .sort()
            .join("|");

    const dangersPart =
        [...dangerSet]
            .sort()
            .join("|");

    return (
        wallsPart +
        "::" +
        goalKey +
        "::" +
        dangersPart
    );
}


/* =========================================================
   맵 생성
========================================================= */

function createMap() {

    const oldWallSnapshot =
        new Set(walls);

    // 새 맵을 충분히 찾지 못하더라도, 검증을 통과한 기존 맵을
    // 다시 사용하는 후보를 하나 보관합니다.
    // 빈(경계만 있는) 맵으로 떨어지는 것보다 기존 맵을 재사용하는 편이 낫습니다.
    let repeatedMapCandidate = null;

    for (
        let attempt = 0;
        attempt < MAX_MAP_ATTEMPTS;
        attempt++
    ) {

        const candidateWalls =
            createRandomWalls();

        const graph =
            buildSlideGraph(
                candidateWalls
            );

        const startKey =
            keyOf(
                stageStart.c,
                stageStart.r
            );

        const analysis =
            analyzeMap(
                graph,
                startKey
            );

        const difficulty =
            Math.min(
                10,
                Math.floor(
                    clearCount / 3
                )
            );

        const requiredReachable =
            MIN_REACHABLE_STATES +
            difficulty * 2;

        const requiredBranching =
            MIN_BRANCHING_STATES +
            Math.floor(
                difficulty / 2
            );

        if (
            analysis.reachableCount <
            requiredReachable
        ) {
            continue;
        }

        if (
            analysis.branchingStates <
            requiredBranching
        ) {
            continue;
        }

        const candidates =
            getGoalCandidates(
                graph,
                analysis.reachable,
                startKey
            );

        if (
            candidates.length === 0
        ) {
            continue;
        }

        const candidatePool =
            candidates.slice(
                0,
                Math.min(
                    8,
                    candidates.length
                )
            );

        const goalCandidate =
            candidatePool[
                randomInt(
                    0,
                    candidatePool.length - 1
                )
            ];

        const goalKey =
            goalCandidate.key;

        const escapeCheck =
            isMapFullyEscapable(
                graph,
                goalKey
            );

        if (
            !escapeCheck.valid
        ) {
            continue;
        }

        const safePath =
            getPathTo(
                graph,
                startKey,
                goalKey
            );

        if (
            !safePath ||
            safePath.length - 1 <
            MIN_PATH_LENGTH
        ) {
            continue;
        }

        const candidateDangers =
            createDanger(
                graph,
                goalKey,
                safePath
            );

        if (
            !verifySafeGoalPath(
                graph,
                goalKey,
                candidateDangers
            )
        ) {
            continue;
        }

        const signature =
            getLayoutSignature(
                candidateWalls,
                goalKey,
                candidateDangers
            );

        if (
            previousLayouts.includes(
                signature
            )
        ) {
            // 이미 나온 맵이면 일단 보관만 하고,
            // 아직 한 번도 나오지 않은 맵을 계속 찾습니다.
            // 끝까지 새 맵을 못 찾으면 이 검증된 맵을 재사용합니다.
            if (!repeatedMapCandidate) {
                repeatedMapCandidate = {
                    walls: new Set(candidateWalls),
                    goalKey,
                    dangers: new Set(candidateDangers),
                    signature
                };
            }
            continue;
        }

        walls =
            candidateWalls;

        beginMapTransition(
            oldWallSnapshot,
            candidateWalls
        );

        goal =
            parseKey(
                goalKey
            );

        dangers =
            candidateDangers;

        previousLayouts.push(
            signature
        );

        if (
            previousLayouts.length >
            MAX_PREVIOUS_LAYOUTS
        ) {
            previousLayouts.shift();
        }

        return true;
    }

    // 새 맵을 모두 찾지 못한 경우에는 검증을 통과했던 기존 맵을 재사용합니다.
    // 이 경우에도 맵 생성/길찾기 검증을 통과한 상태이므로 빈 맵이 출력되지 않습니다.
    if (repeatedMapCandidate) {
        walls =
            repeatedMapCandidate.walls;

        beginMapTransition(
            oldWallSnapshot,
            repeatedMapCandidate.walls
        );

        goal =
            parseKey(
                repeatedMapCandidate.goalKey
            );

        dangers =
            repeatedMapCandidate.dangers;

        return true;
    }

    return createFallbackMap(
        oldWallSnapshot
    );
}


/* =========================================================
   fallback 맵
========================================================= */

function createFallbackMap(
    oldWallSnapshot = new Set(walls)
) {

    const fallbackWalls =
        createBoundaryWalls();

    const addWall = (
        c,
        r
    ) => {

        if (
            !isBoundary(c, r) &&
            !(
                c === stageStart.c &&
                r === stageStart.r
            )
        ) {
            fallbackWalls.add(
                keyOf(c, r)
            );
        }
    };

    for (
        let r = 2;
        r <= 5;
        r++
    ) {
        addWall(5, r);
    }

    for (
        let r = 8;
        r <= 12;
        r++
    ) {
        addWall(10, r);
    }

    for (
        let r = 2;
        r <= 6;
        r++
    ) {
        addWall(14, r);
    }

    for (
        let c = 7;
        c <= 10;
        c++
    ) {
        addWall(c, 5);
    }

    for (
        let c = 12;
        c <= 16;
        c++
    ) {
        addWall(c, 9);
    }

    const graph =
        buildSlideGraph(
            fallbackWalls
        );

    const startKey =
        keyOf(
            stageStart.c,
            stageStart.r
        );

    const reachable =
        getReachableStates(
            graph,
            startKey
        );

    const candidates =
        getGoalCandidates(
            graph,
            reachable,
            startKey
        );

    for (
        const candidate
        of candidates
    ) {

        const escapeCheck =
            isMapFullyEscapable(
                graph,
                candidate.key
            );

        if (
            !escapeCheck.valid
        ) {
            continue;
        }

        const safePath =
            getPathTo(
                graph,
                startKey,
                candidate.key
            );

        if (!safePath) {
            continue;
        }

        const fallbackDangers =
            createDanger(
                graph,
                candidate.key,
                safePath
            );

        if (
            !verifySafeGoalPath(
                graph,
                candidate.key,
                fallbackDangers
            )
        ) {
            continue;
        }

        walls =
            fallbackWalls;

        beginMapTransition(
            oldWallSnapshot,
            fallbackWalls
        );

        goal =
            parseKey(
                candidate.key
            );

        dangers =
            fallbackDangers;

        return true;
    }

    walls =
        createBoundaryWalls();

    beginMapTransition(
        oldWallSnapshot,
        walls
    );

    const simpleGraph =
        buildSlideGraph(
            walls
        );

    const simpleReachable =
        getReachableStates(
            simpleGraph,
            startKey
        );

    const simpleCandidates =
        getGoalCandidates(
            simpleGraph,
            simpleReachable,
            startKey
        );

    if (
        simpleCandidates.length > 0
    ) {

        goal =
            parseKey(
                simpleCandidates[0].key
            );

    } else {

        goal = {
            c: COLS - 2,
            r: ROWS - 2
        };
    }

    dangers =
        new Set();

    return true;
}


/* =========================================================
   맵 전환
========================================================= */

function beginMapTransition(
    oldWallSet,
    newWallSet
) {

    mapTransition.oldWalls =
        new Set(
            oldWallSet
        );

    mapTransition.newWalls =
        new Set(
            newWallSet
        );

    mapTransition.elapsed = 0;

    mapTransition.active = true;

    gameState = "transition";
}


function updateMapTransition(
    delta
) {

    if (
        !mapTransition.active
    ) {
        return;
    }

    mapTransition.elapsed +=
        delta;

    if (
        mapTransition.elapsed >=
        mapTransition.duration
    ) {

        mapTransition.elapsed =
            mapTransition.duration;

        mapTransition.active =
            false;

        gameState =
            "playing";
    }
}


function getWallScaleForTransition(
    isNewWall
) {

    if (
        !mapTransition.active
    ) {
        return 1;
    }

    const p =
        clamp(
            mapTransition.elapsed /
            mapTransition.duration,
            0,
            1
        );

    return isNewWall
        ? 1 - Math.pow(1 - p, 3)
        : Math.pow(1 - p, 3);
}


/* =========================================================
   플레이어 초기화
========================================================= */

function resetPlayer() {

    player.c =
        stageStart.c;

    player.r =
        stageStart.r;

    player.x =
        stageStart.c * CELL;

    player.y =
        stageStart.r * CELL;

    movement = null;

    trail = [];
}


/* =========================================================
   새 게임
========================================================= */

function startNewGame() {

    settingsOpen = false;

    clearTimeout(
        roundTimer
    );

    gameState = "playing";

    lives =
        MAX_LIVES;

    clearCount = 0;

    clearStreak = 0;

    maxClearStreak = 0;

    mapSkips =
        MAX_MAP_SKIPS;

    stageStart = {
        c: START.c,
        r: START.r
    };

    recordSavedForRun =
        false;

    runStartTime =
        new Date();

    activateItemForRun();

    resetRecoil();

    flash.alpha = 0;

    startRound();
}


/* =========================================================
   라운드 시작
========================================================= */

function startRound() {

    clearTimeout(
        roundTimer
    );

    gameState = "playing";

    remainingTime =
        getStageTimeLimit() + activeTimeBonus;

    resetPlayer();

    pathGuideUses = 0;
    pathGuidePath = [];

    createMap();

    if (activeItem === "pathGuide") {
        showPathGuide();
        pathGuideUses = 1;
    }

    if (activeItem === "firstAid") {
        tryAutoFirstAid();
    }

    setMessage("");

    flash.alpha = 0;

    shake.power = 0;
    shake.time = 0;

    updateUI();
}


/* =========================================================
   맵 넘기기
========================================================= */

function skipMap() {

    // 2인용 대전 중에는 맵 넘기기를 사용할 수 없습니다.
    if (multiplayerMatchActive) {
        return;
    }

    if (
        gameState === "start" ||
        gameState === "gameover"
    ) {
        return;
    }

    if (
        mapSkips <= 0
    ) {
        if (openEnergyRecoveryChoice()) {
            showItemWarning("에너지 복구 장치를 사용할 수 있습니다.");
        } else {
            setMessage(
                "맵 넘기기 횟수를 모두 사용했습니다."
            );
        }

        return;
    }

    clearTimeout(
        roundTimer
    );

    mapSkips--;

    if (mapSkips === 0) {
        openEnergyRecoveryChoice();
    }

    gameState =
        "playing";

    remainingTime =
        getStageTimeLimit() + activeTimeBonus;

    resetPlayer();

    pathGuideUses = 0;
    pathGuidePath = [];

    createMap();

    if (activeItem === "pathGuide") {
        showPathGuide();
        pathGuideUses = 1;
    }

    if (activeItem === "firstAid") {
        tryAutoFirstAid();
    }

    applyImpactRecoil(
        90,
        5,
        0.18
    );

    flash.color =
        "#b995ff";

    flash.alpha =
        0.12;

    setMessage(
        `맵을 넘겼습니다. 남은 횟수 ${mapSkips}회`
    );

    updateUI();
}


/* =========================================================
   이동 시작
========================================================= */

function startMove(
    dc,
    dr
) {

    if (
        gameState !== "playing"
    ) {
        return;
    }

    if (movement) {
        return;
    }

    const destination =
        getSlideDestination(
            player.c,
            player.r,
            dc,
            dr
        );

    if (
        destination.c === player.c &&
        destination.r === player.r
    ) {

        applyRecoil(
            dc,
            dr,
            55,
            3,
            0.12
        );

        return;
    }

    const startX =
        player.c * CELL;

    const startY =
        player.r * CELL;

    const targetX =
        destination.c * CELL;

    const targetY =
        destination.r * CELL;

    const distance =
        Math.abs(
            destination.c -
            player.c
        ) +
        Math.abs(
            destination.r -
            player.r
        );

    const duration =
        Math.max(
            0.075,
            distance * 0.010
        );

    // 경로 안내가 아직 실제로 표시 중일 때만 한 번 페이드아웃합니다.
    // 이미 자연스럽게 사라지는 중이거나 완전히 사라진 뒤에는 다시 시작하지 않습니다.
    const guideNow = performance.now();
    if (
        activeItem === "pathGuide" &&
        pathGuidePath.length > 1 &&
        guideNow < pathGuideVisibleUntil &&
        guideNow < pathGuideAutoFadeAt &&
        pathGuideFadeStart === 0
    ) {
        pathGuideFadeStart = guideNow;
        pathGuideVisibleUntil =
            guideNow +
            PATH_GUIDE_FADE_DURATION * 1000;
    }

    movement = {
        startX,
        startY,
        targetX,
        targetY,
        duration,
        elapsed: 0,
        fromC: player.c,
        fromR: player.r,
        toC: destination.c,
        toR: destination.r,
        dc,
        dr
    };
}


/* =========================================================
   이동 업데이트
========================================================= */

function updateMovement(
    delta
) {

    if (!movement) {
        return;
    }

    movement.elapsed +=
        delta;

    const progress =
        clamp(
            movement.elapsed /
            movement.duration,
            0,
            1
        );

    const eased =
        1 -
        Math.pow(
            1 - progress,
            3
        );

    player.x =
        movement.startX +
        (
            movement.targetX -
            movement.startX
        ) *
        eased;

    player.y =
        movement.startY +
        (
            movement.targetY -
            movement.startY
        ) *
        eased;

    if (
        trail.length === 0 ||
        Math.hypot(
            player.x -
            trail[
                trail.length - 1
            ].x,

            player.y -
            trail[
                trail.length - 1
            ].y
        ) > 8
    ) {

        trail.push({
            x: player.x,
            y: player.y,
            life: 1
        });

        if (
            trail.length > 12
        ) {
            trail.shift();
        }
    }

    if (
        progress >= 1
    ) {

        player.c =
            movement.toC;

        player.r =
            movement.toR;

        player.x =
            movement.targetX;

        player.y =
            movement.targetY;

        const finishedMovement =
            movement;

        movement = null;

        applyRecoil(
            finishedMovement.dc,
            finishedMovement.dr,
            10,
            1,
            0.10
        );

        checkTile();
    }
}


/* =========================================================
   칸 검사
========================================================= */

function checkTile() {

    const current =
        keyOf(
            player.c,
            player.r
        );

    if (
        dangers.has(current)
    ) {

        dieGame();

        return;
    }

    if (
        goal &&
        player.c === goal.c &&
        player.r === goal.r
    ) {

        clearGame();
    }
}


/* =========================================================
   클리어
========================================================= */

function clearGame() {

    if (
        gameState !== "playing"
    ) {
        return;
    }

    if (multiplayerMatchActive) {
        movement = null;
        gameState = "multiplayerWaitingRound";
        multiplayerRoundTransition = false;
        multiplayerSend({ type: "finish", round: multiplayerRound, position: { c: player.c, r: player.r } });
        setMessage("클리어! 상대 결과를 확인하는 중...");
        updateUI();
        return;
    }

    stageStart = {
        c: player.c,
        r: player.r
    };

    gameState =
        "cleared";

    movement = null;

    clearCount++;

    if (
        clearCount >
        maxClearCount
    ) {

        maxClearCount =
            clearCount;

        localStorage.setItem(
            "slidingMazeMaxClearCount",
            String(maxClearCount)
        );
    }

    clearStreak++;

    coins++;
    saveCoins();

    if (activeItem === "energyShield" && clearCount % 3 === 0) {
        shieldCharges++;
        showItemWarning(`에너지 보호 시스템 재정비 완료 · 보호막 ${shieldCharges}개`);
    }

    if (activeItem === "firstAid" && clearCount % 4 === 0) {
        firstAidCharged = true;
        tryAutoFirstAid();
    }

    maxClearStreak =
        Math.max(
            maxClearStreak,
            clearStreak
        );

    allTimeBestStreak =
        Math.max(
            allTimeBestStreak,
            clearStreak
        );

    try {

        localStorage.setItem(
            "slideMazeBestStreak",
            String(
                allTimeBestStreak
            )
        );

    } catch (error) {}

    applyImpactRecoil(
        150,
        12,
        0.32
    );

    flash.color =
        "#63ff91";

    flash.alpha =
        0.25;

    setMessage(
        `클리어! ${clearCount}회`
    );

    updateUI();

    roundTimer =
        setTimeout(
            () => {

                if (
                    gameState ===
                    "cleared"
                ) {
                    startRound();
                }

            },
            700
        );
}


/* =========================================================
   사망
========================================================= */

function dieGame() {

    if (
        gameState !== "playing"
    ) {
        return;
    }

    movement = null;

    const dangerKey = keyOf(player.c, player.r);

    if (activeItem === "energyShield" && shieldCharges > 0) {
        shieldCharges--;
        dangers.delete(dangerKey);
        applyImpactRecoil(130, 9, 0.25);
        flash.color = "#69c8ff";
        flash.alpha = 0.20;
        setMessage(`에너지 보호막 시스템 발동 · 보호막 ${shieldCharges}개 남음`);
        tryAutoFirstAid();
        updateUI();
        return;
    }

    lives--;

    if (tryAutoFirstAid()) {
        gameState = "playing";
        clearStreak = 0;
        updateUI();
        return;
    }

    clearStreak = 0;

    applyImpactRecoil(
        190,
        14,
        0.40
    );

    flash.color =
        "#ff3e4d";

    flash.alpha =
        0.32;

    if (multiplayerMatchActive) {
        sendMultiplayerEliminated();
        return;
    }

    gameState = "dead";

    if (
        lives > 0
    ) {

        setMessage(
            `위험 블록! 목숨 ${lives}개 남음`
        );

        updateUI();

        roundTimer =
            setTimeout(
                () => {

                    if (
                        gameState ===
                        "dead"
                    ) {
                        startRound();
                    }

                },
                850
            );

    } else {

        if (multiplayerMatchActive) {
            sendMultiplayerEliminated();
            return;
        }

        setMessage(
            "목숨을 모두 잃었습니다."
        );

        updateUI();

        roundTimer =
            setTimeout(
                () => {

                    if (
                        gameState ===
                        "dead"
                    ) {
                        finishGameOver();
                    }

                },
                850
            );
    }
}


/* =========================================================
   시간 초과
========================================================= */

function timeoutGame() {

    if (
        gameState !== "playing"
    ) {
        return;
    }

    movement = null;

    remainingTime = 0;

    lives--;

    if (tryAutoFirstAid()) {
        gameState = "playing";
        clearStreak = 0;
        remainingTime = getStageTimeLimit() + activeTimeBonus;
        updateUI();
        return;
    }

    clearStreak = 0;

    applyImpactRecoil(
        130,
        10,
        0.30
    );

    flash.color =
        "#ff9d3b";

    flash.alpha =
        0.32;

    if (multiplayerMatchActive) {
        sendMultiplayerEliminated();
        return;
    }

    gameState =
        "timeout";

    if (
        lives > 0
    ) {

        setMessage(
            `시간 초과! 목숨 ${lives}개 남음`
        );

    } else {

        if (multiplayerMatchActive) {
            sendMultiplayerEliminated();
            return;
        }

        setMessage(
            "시간 초과! 목숨을 모두 잃었습니다."
        );
    }

    updateUI();

    roundTimer =
        setTimeout(
            () => {

                if (
                    gameState !==
                    "timeout"
                ) {
                    return;
                }

                if (
                    lives > 0
                ) {

                    startRound();

                } else {

                    finishGameOver();
                }

            },
            850
        );
}


/* =========================================================
   게임 오버
========================================================= */

function finishGameOver() {

    clearTimeout(
        roundTimer
    );

    if (multiplayerMatchActive) {
        sendMultiplayerEliminated();
        return;
    }

    gameState =
        "gameover";

    movement = null;

    deactivateItemForRun();

    applyImpactRecoil(
        240,
        18,
        0.55
    );

    flash.color =
        "#ff263d";

    flash.alpha =
        0.28;

    saveRecentRecord();

    setMessage(
        `게임 오버 — ${clearCount}회 클리어 / ${maxClearStreak}회 연속 클리어`
    );

    updateUI();
}


/* =========================================================
   기록 저장
========================================================= */

function saveRecentRecord() {

    if (
        recordSavedForRun
    ) {
        return;
    }

    recordSavedForRun =
        true;

    const now =
        new Date();

    const formatRecordTime =
        date =>
            date.toLocaleTimeString(
                "ko-KR",
                {
                    hour: "numeric",
                    minute: "2-digit",
                    hour12: true
                }
            );

    const startTime =
        runStartTime ||
        now;

    const record = {
        startTime:
            formatRecordTime(
                startTime
            ),

        endTime:
            formatRecordTime(
                now
            ),

        clears:
            clearCount,

        maxStreak:
            maxClearStreak
    };

    recentRecords.unshift(
        record
    );

    recentRecords =
        recentRecords.slice(
            0,
            5
        );

    try {

        localStorage.setItem(
            "slideMazeRecentRecords",
            JSON.stringify(
                recentRecords
            )
        );

    } catch (error) {}
}


/* =========================================================
   UI 업데이트
========================================================= */

function updateUI() {

    document.getElementById(
        "time"
    ).textContent =
        `시간 ${remainingTime.toFixed(1)}초`;

    let hearts = "";

    for (
        let i = 0;
        i < MAX_LIVES;
        i++
    ) {

        hearts +=
            i < lives
                ? "♥"
                : "♡";

        if (
            i <
            MAX_LIVES - 1
        ) {
            hearts += " ";
        }
    }

    document.getElementById(
        "lives"
    ).textContent =
        `목숨 ${hearts}`;

    document.getElementById(
        "clears"
    ).textContent =
        `클리어 ${clearCount}회`;

    let skipIcons = "";

    for (
        let i = 0;
        i < MAX_MAP_SKIPS;
        i++
    ) {

        skipIcons +=
            i < mapSkips
                ? "●"
                : "○";

        if (
            i <
            MAX_MAP_SKIPS - 1
        ) {
            skipIcons += " ";
        }
    }

    const mapSkipsElement = document.getElementById("mapSkips");
    mapSkipsElement.textContent = `맵 넘기기 ${skipIcons}`;
    mapSkipsElement.style.display = (multiplayerMatchActive || gameState === "multiplayerWaitingRound" || gameState === "multiplayerWaitingResult" || gameState === "multiplayerResult") ? "none" : "block";

    const itemInfo = document.getElementById("itemInfo");
    const itemWarning = document.getElementById("itemWarning");

    if (activeItem) {
        itemInfo.textContent =
            `${ITEM_DATA[activeItem].icon} ${ITEM_DATA[activeItem].name}`;
    } else {
        itemInfo.textContent = "아이템 미사용";
    }

    itemWarning.textContent =
        performance.now() < itemWarningUntil
            ? itemWarningText
            : "";
}


/* =========================================================
   PC 키보드
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if (energyRecoveryChoiceOpen && !event.repeat) {
            if (key === "1") {
                useEnergyRecovery(1);
                return;
            }
            if (key === "2") {
                useEnergyRecovery(2);
                return;
            }
            return;
        }

        if (
            key === "g" &&
            !event.repeat
        ) {

            event.preventDefault();

            if (
                gameState === "start"
            ) {

                startNewGame();

            } else if (
                gameState !==
                "gameover"
            ) {

                skipMap();
            }

            return;
        }

        if (
            (
                key === "r" ||
                event.code === "Space"
            ) &&
            !event.repeat
        ) {

            event.preventDefault();

            if (
                gameState === "gameover" ||
                gameState === "multiplayerResult" ||
                gameState === "multiplayerWaitingResult"
            ) {

                if (gameState === "multiplayerResult" || gameState === "multiplayerWaitingResult") {
                    closeMultiplayerSocket();
                    multiplayerOpen = false;
                    multiplayerRole = null;
                    multiplayerResult = null;
                }

                gameState = "start";

                settingsOpen =
                    false;

                resetRecoil();

                flash.alpha = 0;

                setMessage("");

                updateUI();
            }

            return;
        }

        if (
            gameState === "start"
        ) {

            if (
                event.repeat
            ) {
                return;
            }

            startNewGame();

            return;
        }

        if (
            gameState ===
            "gameover"
        ) {
            return;
        }

        if (
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d"
        ) {

            event.preventDefault();

            if (
                event.repeat
            ) {
                return;
            }

            if (
                key === "w"
            ) {
                startMove(0, -1);
            }

            if (
                key === "a"
            ) {
                startMove(-1, 0);
            }

            if (
                key === "s"
            ) {
                startMove(0, 1);
            }

            if (
                key === "d"
            ) {
                startMove(1, 0);
            }
        }
    }
);
